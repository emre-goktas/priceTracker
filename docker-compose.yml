version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: pricebot_minio
    ports:
      - "9010:9000"    # API Portu (9000 host'ta başka bir projenin minio'suyla çakışıyor)
      - "9011:9001"    # Web Arayüz (Console) Portu
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperSecretPassword123!}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: pricebot_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-pricebot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: price_bot_app
    network_mode: host  # .env'deki POSTGRES_URL/MINIO_URL 'localhost' referanslarını değiştirmeden çalıştırır
    env_file: .env
    volumes:
      - .:/app  # git pull sonrası sadece restart yeterli olsun; matching/pricebot.duckdb ve logs/ kalıcı kalır
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
