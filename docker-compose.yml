version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: ecomm_minio
    ports:
      - "9000:9000"    # API Portu
      - "9001:9001"    # Web Arayüz (Console) Portu
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperSecretPassword123!}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: ecomm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-pricebot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  minio_data:
  postgres_data:
