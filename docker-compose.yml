version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: ecomm_minio
    ports:
      - "9000:9000"    # API Portu
      - "9001:9001"    # Web Arayüz (Console) Portu
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperSecretPassword123!}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_data:
