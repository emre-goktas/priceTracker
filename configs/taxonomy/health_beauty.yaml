# Kanonik ürün taksonomisi — HEALTH & BEAUTY vertical'ı (sadece "kozmetik" değil — bu 3 site
# eczane/drogeri formatında, kozmetiğin yanında vitamin/ilk yardım/kondom da satıyor; bunlar
# Google'ın taksonomisinde de AYNI üst kategoride, "Health Care" adında kardeş bir dal olarak
# duruyor. Dosya adı bilerek "cosmetics.yaml" değil "health_beauty.yaml" — kapsamı dürüstçe
# yansıtsın diye).
#
# Kaynak: Google Product Taxonomy (https://www.google.com/basepages/producttype/taxonomy-with-ids.en-US.txt)
# "Health & Beauty" dalının iki kolundan (Personal Care + Health Care) uyarlanmıştır. ID'ler ve
# İngilizce isimler doğrudan Google'ın taksonomisinden alınmıştır — endüstri standardı, stabil,
# dile bağlı değil. Bu bizim icat ettiğimiz bir şema değil; ihtiyacımıza göre bir ALT KÜME seçilmiştir.
#
# Neden vertical-scoped ayrı dosya (configs/tr/ değil configs/taxonomy/ altında):
# Taksonomi ülkeye değil VERTICAL'a (sektöre) bağlıdır — bu kategoriler TR'de de AB'de de
# kavramsal olarak aynıdır, sadece gösterim ismi yerelleşir. İleride elektronik/market gibi
# GERÇEKTEN FARKLI bir vertical'a (Google'da ayrı bir üst kategori: "Electronics", "Food,
# Beverages & Tobacco" gibi) geçildiğinde o kendi dosyasını alır (configs/taxonomy/electronics.yaml
# gibi) — çekirdek kodda hiçbir değişiklik gerekmez. Ama "Sağlıklı Yaşam"daki vitamin/ilk yardım
# gibi kalemler market'i BEKLEMEZ, çünkü zaten bu dosyanın (Health & Beauty) kapsamında.
#
# Kanonik ID'ler İngilizce/ASCII'dir (uluslararasılaşma için) — gösterim ismi (display_name)
# dile göre ayrı tutulur, ID hiçbir zaman değişmez.
#
# Eşleme (hangi site kategorisi hangi canonical id'ye gider) configs/taxonomy/mappings/{site}.yaml
# dosyalarında yaşar. Eşleme ürünün EN SPESİFİK category_path segmentine göre yapılır (crawl için
# kullandığımız geniş ana kategoriye göre değil) — bkz. mapping dosyalarındaki notlar.

source:
  name: "Google Product Taxonomy"
  version: "2021-09-21"
  root: "Health & Beauty"

categories:
  - id: makeup
    google_taxonomy_id: 477
    display_name: {tr: "Makyaj", en: "Makeup"}

  - id: skin_care
    google_taxonomy_id: 567
    display_name: {tr: "Cilt Bakımı", en: "Skin Care"}

  - id: hair_care
    google_taxonomy_id: 486
    display_name: {tr: "Saç Bakımı", en: "Hair Care"}

  - id: perfume_cologne
    google_taxonomy_id: 479
    display_name: {tr: "Parfüm", en: "Perfume & Cologne"}

  - id: deodorant_antiperspirant
    google_taxonomy_id: 484
    display_name: {tr: "Deodorant", en: "Deodorant & Anti-Perspirant"}

  - id: nail_care
    google_taxonomy_id: 478
    display_name: {tr: "Tırnak Bakımı", en: "Nail Care"}

  - id: oral_care
    google_taxonomy_id: 526
    display_name: {tr: "Ağız ve Diş Bakımı", en: "Oral Care"}

  - id: shaving_grooming
    google_taxonomy_id: 528
    display_name: {tr: "Tıraş ve Bakım", en: "Shaving & Grooming"}

  - id: foot_care
    google_taxonomy_id: 515
    display_name: {tr: "Ayak Bakımı", en: "Foot Care"}

  - id: feminine_sanitary
    google_taxonomy_id: 485
    display_name: {tr: "Kadın Hijyen Ürünleri", en: "Feminine Sanitary Supplies"}

  - id: bath_body
    google_taxonomy_id: 474
    display_name: {tr: "Banyo ve Vücut Bakımı", en: "Bath & Body"}

  - id: cosmetic_tools
    google_taxonomy_id: 2619
    display_name: {tr: "Kozmetik Aletleri", en: "Cosmetic Tools"}

  - id: baby_bathing
    google_taxonomy_id: 4678
    display_name: {tr: "Bebek Banyo Ürünleri", en: "Baby Bathing"}
    note: "Google'da farklı bir üst dalda (Baby & Toddler, Personal Care değil) - cross-reference"

  - id: diapering
    google_taxonomy_id: 548
    display_name: {tr: "Bebek Bezi ve Islak Mendil", en: "Diapering"}
    note: "Google'da farklı bir üst dalda (Baby & Toddler, Personal Care değil) - cross-reference"

  # --- Health Care dalı (Personal Care'in kardeşi, hâlâ Health & Beauty içinde) ---
  # Watsons/Rossmann'ın "Sağlıklı Yaşam" gibi kategorilerindeki vitamin/ilk yardım/kondom
  # ürünleri buraya düşer. Bunlar market/grocery vertical'ı DEĞİL, aynı Health & Beauty
  # vertical'ının başka bir dalı.
  - id: vitamins_supplements
    google_taxonomy_id: 525
    display_name: {tr: "Vitamin ve Takviye", en: "Vitamins & Supplements"}

  - id: first_aid
    google_taxonomy_id: 508
    display_name: {tr: "İlk Yardım", en: "First Aid"}

  - id: condoms
    google_taxonomy_id: 775
    display_name: {tr: "Kondom", en: "Condoms"}

  - id: uncategorized
    google_taxonomy_id: null
    display_name: {tr: "Diğer / Sınıflandırılmamış", en: "Uncategorized"}
    note: >
      Bu dosyanın (Health & Beauty) kapsamına HİÇ girmeyen ürünler için fallback — örn.
      Gratis'in Ev & Yaşam, Süpermarket, Moda & Aksesuar, Elektrikli Ürünler kategorileri
      (Google'da tamamen farklı üst kategoriler: Home & Garden, Food/Beverages, Apparel,
      Electronics gibi). Bunlar gerçekten farklı bir vertical'a ait, o vertical için site
      eklendiğinde kendi taksonomi dosyalarını alacaklar (bkz. Süpermarket/Ev-Yaşam/Temizlik —
      market/ev vertical'ı, market sitesi eklenince çözülür).
      Ayrıca ürün-tipi olmayan pazarlama/etiket kategorileri de (K-Beauty, Sürdürülebilir
      Yaşam gibi) buraya düşer — bunlar canonical bir ÜRÜN TİPİ değil, ürün kendi
      category_path'indeki asıl tipine göre ayrıca sınıflandırılır.
