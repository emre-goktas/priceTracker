# (örn. ["Makyaj", "Dudak Makyajı", "Dudak Kalemi"]). Bu yüzden burada ID yerine doğrudan İSİM
# eşlemesi var. matching/normalize.py bir ürünün category_path'indeki HER segmenti bu tabloda
