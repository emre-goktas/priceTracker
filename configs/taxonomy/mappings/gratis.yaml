# Gratis kategori ID'si -> configs/taxonomy/health_beauty.yaml canonical ID eşlemesi.
# İLK TASLAK — "draft: true" olan satırlar belirsiz/umbrella kategoriler, insan gözden
# geçirmesi gerekiyor (bkz. CLAUDE.md: kategori/eşleme kararları LLM ile otomatik verilmez).
#
# NOT: Bu eşleme main_categories (crawl için kullandığımız geniş ana kategori) seviyesinde.
# Tek bir ana kategori altında birden fazla ürün tipi olabilir (örn. 504 hem parfüm hem
# deodorant içerir) — asıl hassas eşleme matching/normalize.py'de ürünün kendi category_path'ine
# bakılarak (Google'ın "Deodorant" / "Perfume" gibi en spesifik segmentiyle) yapılacak. Buradaki
# tablo o ürün-bazlı eşlemenin bulamadığı durumlarda kullanılacak bir varsayılan/fallback.

