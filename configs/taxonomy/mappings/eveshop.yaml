# Eveshop kategori -> configs/taxonomy/health_beauty.yaml canonical ID eşlemesi.
# İLK TASLAK — "draft: true" olan satırlar belirsiz/umbrella kategoriler, insan gözden
# geçirmesi gerekiyor (bkz. CLAUDE.md).
#
# METODOLOJİ — İKİ FARKLI VERİ KAYNAĞI KARIŞIK KULLANILIYOR:
# 1) `/products/{handle}.js` endpoint'inin `type` alanından (örn. "Eve Genel Hiyerarşi >
#    RENKLİ KOZMETİK > GÖZ ÜRÜNLERİ") 168 ürünlük BİR ÖRNEKLEMLE (2026-07-30, tam popülasyon
#    DEĞİL) çıkarılan girdiler - anahtar format "ANA KATEGORİ > ALT KATEGORİ" (sabit kök
#    "Eve Genel Hiyerarşi >" çıkarıldı). Hâlâ makyaj/cilt-bakimi/sac-bakimi/cok-satan-urunler
#    için tek kaynak bu - sayılar örneklemde gözlemlenen, kesin popülasyon değil.
# 2) Kullanıcının sitedeki "Ürün Grubu" filtre panelinden MANUEL topladığı TAM/KESİN sayılar
#    (2026-07-30) - erkek-bakim, kisisel-bakim, parfum-deodorant, ev-yasam, anne-bebek için.
#    Anahtar format tek bir spesifik etiket (Gratis'teki gibi, örn. "Diş Macunu") - bu 5
#    kategoride ESKİ örneklem-bazlı "ANA > ALT" girdileri BUNLARLA DEĞİŞTİRİLDİ (kesin sayı,
#    tam popülasyon - toplamlar sitemap'ten bilinen gerçek kategori büyüklükleriyle birebir
#    örtüşüyor, doğrulandı: erkek-bakim 101, kişisel-bakim 869, parfum-deodorant 590,
#    ev-yasam 176, anne-bebek 81).
#
# AÇIK SORU (matching/normalize.py yazılırken çözülmeli): (2)'deki "Ürün Grubu" etiketlerinin
# ham ürün JSON'unda (muhtemelen `tags` array'i - "MASKARA" gibi spesifik değerler orada
# görüldü) tam olarak hangi alanda/formatta karşılığı olduğu DOĞRULANMADI. (1)'deki `type` alanı
# her ürün için garanti var (canlı test edildi) ama (2) kadar granüler değil. Öneri: önce (2)
# (varsa) sonra (1) sonra main_categories fallback sırasıyla dene.
#
# Eşleme önceliği: matching/normalize.py önce category_path_overrides'ta ürünün en spesifik
# etiketini (Ürün Grubu varsa, yoksa type'ın ALT KATEGORİ segmenti) arasın, bulamazsa aşağıdaki
# main_categories (crawl kategorisi) fallback'ine düşsün.

# --- main_categories (crawl için kullanılan 9 ana kategori, configs/tr/eveshop.yaml) ---
makyaj: {canonical: makeup, name: "Makyaj"}
