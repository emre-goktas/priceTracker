anne-bebek: {canonical: baby_bathing, name: "Anne & Bebek", draft: true, note: "gerçek dağılım (2026-07-30, toplam 81 - kesin): ağırlıklı baby_bathing (78/81, %96), 3 ürün diapering (Pişik Kremi) - bkz. category_path_overrides"}
