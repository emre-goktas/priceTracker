# Rossmann fetch-özel config. Kapsam: sitenin TAMAMI (kategori filtresi yok).
# Doğrulandı: curl_cffi (impersonate=chrome120) ile 200 OK, tek istekte EAN+fiyat+stok geliyor.
# Regex/kategori ID gibi kırılgan bilgiler burada (YAML) yaşar, core/parsers/site_plugins/rossmann.py
# içine literal olarak gömülmez — self-heal sadece bu dosyayı güncelleyebildiği için (bkz. CLAUDE.md).

base_headers:
  Accept: "*/*"
  Accept-Language: "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7"
  Referer: "https://www.rossmann.com.tr/"
  X-Requested-With: "XMLHttpRequest"

# Sayfalar/kategoriler arası bekleme + retry — hardcode değil, buradan okunur (bkz.
# core/parsers/base_parser.py).
rate_limit:
  delay_seconds: 1.5
  max_retries: 3
  retry_backoff_seconds: 2.0

# Ana kategori ID'leri artık statik (main_categories) — bunlar veritabanı/API key'i, kolay
# kolay değişmez. Ampirik olarak doğrulandı (2026-07-29): bu 7 kategorinin toplamı (~8839,
# çakışma üst sınırı) kategori filtresi olmadan bulunan tüm katalog sayısıyla (~8786) pratik
# olarak birebir örtüşüyor — yani eksiksiz kapsama. "Saç Bakım"/"Erkek Bakım" gibi navbar'da
# göze çarpan bazı öğeler yapısal olarak kisisel-bakim'in (id=4) ÇOCUĞU, ayrı kök değil; parent
# ID'yle sorgulamak zaten tüm alt-ağacın ürünlerini kapsıyor (anchor-category davranışı) —
# bu yüzden tek tek alt kategori taramaya gerek yok.
main_categories:
  - {id: "3", name: "Makyaj"}
  - {id: "4", name: "Kişisel Bakım"}
  - {id: "5", name: "Anne / Bebek"}
  - {id: "6", name: "Sağlık / Gıda"}
  - {id: "7", name: "Temizlik"}
  - {id: "8", name: "Ev / Yaşam"}
  - {id: "49", name: "Cilt Bakımı"}

# category_discovery aşağıda REFERANS olarak duruyor (her kök kategori sayfası kendi JS
# state'inde `currentCategory: N` taşıyor — bu listenin nasıl türetildiğinin kaydı) ve normal
# fetch akışında ÇALIŞTIRILMAZ; selfheal katmanında kategori drift kontrolü için değerlendirilecek.
category_discovery:
  strategy: category_page_scrape
  root_slug_source:
    from: sitemap_urls
    exclude_patterns: ["-p-", "cdn.rossmann"]
    group_by: "parent_segment_of_nested_path"
    min_child_paths: 10   # doğrulandı: gerçek kökler 15-87 alt-path, kampanya sayfaları hep 0-1
  extraction:
    own_id_regex: "currentCategory:\\s*([0-9]+)"
    children_json_key: "childPathsMapping"
    # childPathsMapping örneği: {"1/2/4/50": {"entity_id":"50","name":"Ağız ve Diş Bakım"}, ...}
  # Doğrulandı (2026-07-28), navbar isimleriyle sıra dahil birebir eşleşti:
  #   kisisel-bakim id=4  -> 50 Ağız ve Diş Bakım, 178 Banyo Ürünleri, 51 Parfüm & Deodorant,
  #                          52 Saç Bakım, 56 Kadın Bakım Ürünleri, 57 Epilasyon/Ağda/Tıraş,
  #                          58 Ayak Bakımı, 53 Erkek Bakım
  #   temizlik id=7       -> 188 Genel Temizlik, 156 Çamaşır, 157 Bulaşık, 158 Fırın, 160 Banyo,
  #                          159 Mutfak Temizlik Malzemeleri, 162 Temizlik Malzemeleri, 163 Kokular
  #   makyaj id=3         -> 9 Dudak, 10 Göz-Kaş, 11 Yüz, 12 Tırnak, 13 Makyaj Aksesuarları,
  #                          14 Doğal Makyaj Ürünleri
  #   diğer kök slug'lar (cilt-bakimi, ev-yasam, anne-bebek, saglik-gida) aynı yöntemle işlenir.
  # NOT: "Saç Bakım"/"Erkek Bakım" navbar'da göze çarpsa da yapısal olarak kisisel-bakim'in
  # ÇOCUĞU (id=4 altında) — ayrı kök kategori değiller, bu kasıtlı bir tasarım, eksiklik değil.

category_search_api:
  method: GET
  url: "https://www.rossmann.com.tr/elastic.php"
  params:
    categoryId: "{category_id}"
    order: position
    direction: asc
    from: "{offset}"
    size: "{limit}"
  pagination:
    offset_param: from
    limit_param: size
    page_size: 60   # eski rossmann_batch.py'de 60 max limit notu vardı; 12 ve 60 ikisi de 200 döndü
  response:
    format: json
    total_count_path: "product.hits.total.value"
    items_path: "product.hits.hits"
    # her hit, gerçek ürün verisi hit._source altında sarmalanmış.

# matching/duckdb_pipeline.py'nin dedup adımı için: ham üründe kararlı/benzersiz kimlik hangi
# alanda. Rossmann'da bu, gerçek çoklu-kategori üyeliğinden geliyor (cat_pos_* ile aynı doğa,
# doğrulandı 2026-07-30) - sayfalama hatası değil.
product_id_field: "_source.id"

# field_mapping — 2026-08-02'de yazıldı. Kullanıcının elindeki bağımsız kaynaklar (tek ürünlük
# örnek JSON, "explanation" alanlarıyla annotate edilmiş + 364 satırlık CSV) SADECE başlangıç
# örneklemesi/kroki olarak kullanıldı, Gemini'nin doc1/02/03'teki iddiaları da dahil hiçbir
# şeye doğrudan güvenilmedi (bkz. feedback_verify_ai_reports.md) - her satır ya raw_rossmann'daki
# gerçek veriyle (N=364 CSV karşılaştırması) ya da kullanıcının CANLI sitede/sepette yaptığı
# testlerle çapraz kontrol edildi.
#
# BÜYÜK ÖLÇEKLİ CSV DOĞRULAMASI (364 ürün, kullanıcının bağımsız/eski kaydı, raw_rossmann'ın
# 2026-08-01 snapshot'ıyla programatik karşılaştırıldı):
#   barcode: 359/359 (%100) BİREBİR  |  name: 359/359 (%100) BİREBİR
#   price: 358/359 (%99.7)  |  special_price: 358/359 (%99.7)  |  is_in_stock: 350/359 (%97.5)
#   crm_price: 270/359 (%75.2, kalan fark zamanlama - CSV daha eski bir tarihten, kampanya
#   değişken - Watsons'taki otherPrices'la aynı doğa)
#   qty: 119/359 (%33.1) ve sold: 14/359 (%3.9) - DÜŞÜK ama SORUN DEĞİL, bunlar doğası gereği
#   sürekli değişen canlı sayaçlar (stok satıldıkça azalır, sold hep artar), aynı anda alınmayan
#   2 snapshot'ta eşleşmeleri zaten beklenmez.
#
# EN ÖNEMLİ BULGU - crm_price ("Rossmann Card Fiyatı") GERÇEKTEN KOŞULLU, Watsons'ın
# otherPrices/MEMBER'ından FARKLI (2026-08-02, kullanıcı canlı sepet testi):
#   Ürün: SR12062947, price=179, crm_price=159. Sayfada İKİ fiyat da gösteriliyor (179,00 TL +
#   "Rossmann Card ile 159,00") - Watsons gibi PUBLIC görünür. AMA sepete eklenince "Ara Toplam:
#   179,00 TL" çıktı + banner: "Rossmann Card üyesi olmanız halinde toplam indirim tutarı: 20.00
#   TL" - yani indirim GERÇEKTEN karta/üyeliğe koşullu, giriş yapmadan/kart olmadan
#   UYGULANMIYOR. Watsons'ta member fiyatı login GEREKTİRMEDEN gerçekten ödenen fiyattı (3
#   checkout testinde doğrulanmıştı) - Rossmann'da AYNI VARSAYIMI yapıp crm_price'ı
#   sale_price_try'a coalesce etmek YANLIŞ olurdu, bu yüzden Gratis'in conditional_promo_price_try
#   deseni kullanıldı (ayrı alan, sale_price_try'a KARIŞTIRILMADI).
#
# confidence seviyeleri (Gratis/Watsons'la aynı sözleşme):
#   verified_checkout   -> gerçek sepete eklenip/checkout'a gidilip doğrulandı
#   verified_data       -> raw_rossmann'daki gerçek veriyle (N=364 CSV dahil) doğrulandı
#   plausible_unverified -> mantıklı ama canlı sitede bizzat çapraz kontrol edilemedi
field_mapping:
  id: {strategy: direct_path, path: "_source.id", confidence: verified_data, note: "product_id_field zaten bu, sayısal Magento entity ID"}
  source_sku: {strategy: direct_path, path: "_source.sku", confidence: verified_data, note: "N=364 CSV karşılaştırmasında dolaylı doğrulandı (sku ile lookup yapıldı, hepsi bulundu)"}
  ean: {strategy: computed, formula: "list_value(\"_source.barcode\")", confidence: verified_data, note: "364/364 (%100) CSV'nin 'Barkod' sütunuyla BİREBİR eşleşti - Watsons'ın aksine burada EAN gerçekten güvenilir, canlı sitede de gösterilmiyor olsa da bu geniş çaplı bağımsız kaynak doğrulaması yeterli kanıt sayılır. DÜZELTME (2026-08-02): tek değer ama silver'da tüm sitelerle tip tutarlılığı için VARCHAR[] listeye sarıldı (bkz. Watsons/Eveshop notları)."}
  name: {strategy: direct_path, path: "_source.name", confidence: verified_data, note: "364/364 (%100) BİREBİR eşleşti. UYARI: en az 1 üründe (ST25110370) isim başında gizli UTF-8 BOM karakteri (\\ufeff) var - Rossmann'ın kendi veri kalitesi sorunu, normalize.py'de strip edilmeli."}
  brand: {strategy: direct_path, path: "_source.brand", confidence: verified_data, note: "%100 dolu. _source.branding (%39.4 dolu, çoğu boş) AYRI/ek bir alan değil - kullanılmıyor."}
  url: {strategy: computed, formula: "'https://www.rossmann.com.tr/' || \"_source.url_key\"", confidence: verified_checkout, note: "url_key zaten TAM slug (örn. 'babydream-bebek-alt-degistirme-ortusu-10-adet-p-sr12062947'), sadece base_url + '/' eklemek yeterli - kullanıcı canlı denedi, doğru sayfa açıldı."}
  image_url: {strategy: computed, formula: "'https://www.rossmann.com.tr/media/catalog/product' || \"_source.image\"", confidence: verified_data, note: "GÖRECELİ path (örn. '/f/f/ff938d....jpeg') - base + '/media/catalog/product' + path programatik olarak denendi (HEAD isteği): 200 image/jpeg döndü, gerçek görsel doğrulandı (2026-08-02). Alternatif 'https://cdn.rossmann.com.tr/media/catalog/product' + path de 200 dönüyor (image/webp, optimize edilmiş sürüm) ama ana domain daha basit/garantili olduğu için o seçildi."}
  currency: {strategy: static, value: "TRY", confidence: verified_data, note: "Rossmann ham veride ayrı bir currency alanı yok, tüm fiyatlar zaten TL - Gratis/Watsons'tan farklı olarak sabit."}

  # --- Fiyat: N=364 CSV doğrulaması + kullanıcının CANLI sepet testiyle netleşti ---
  list_price_try: {strategy: direct_path, path: "_source.price", confidence: verified_checkout, note: "CSV'nin 'Standart Fiyat'ıyla 358/359 (%99.7) eşleşti + sepette 'Ara Toplam' ile birebir (179,00 TL) doğrulandı. BIGINT (kuruş değil, tam TL)."}
  sale_price_try: {strategy: computed, formula: "CASE WHEN (CASE WHEN try_cast(\"_source.ross_60_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.ross_60_price\" AS DOUBLE) ELSE \"_source.special_price\" END) > 0 AND (CASE WHEN try_cast(\"_source.ross_60_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.ross_60_price\" AS DOUBLE) ELSE \"_source.special_price\" END) < \"_source.price\" THEN (CASE WHEN try_cast(\"_source.ross_60_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.ross_60_price\" AS DOUBLE) ELSE \"_source.special_price\" END) ELSE \"_source.price\" END", confidence: verified_checkout, note: "DÜZELTME (2026-08-02): önce burada sadece 'price' vardı - YANLIŞTI. Kullanıcının 'kart dışı farklı fiyatlama olabilir' şüphesi üzerine Rossmann'ın CANLI sayfasındaki JS kaynak kodu (Alpine.js store, 'price.specialPrice/hasSpecial/displayType' fonksiyonları) incelendi: ross_60_price (Gemini'nin 'kullanılmıyor' dediği alan) DOLU VE price'tan düşükse special_price'ın ÖNÜNE geçiyor, VE bu fiyat sayfada/sepette HİÇBİR rozet olmadan (ne 'Rossmann Card' ne başka bir koşul yazısı) doğrudan gösteriliyor - yani gerçekten koşulsuz. Canlı doğrulandı (ST25110099: price=554, ross_60_price=299, crm_price=0 - sayfada '554,00 TL' üstü çizili + '299,00 TL' kırmızı rozetsiz, sepette de 299,00 TL kesildi). N=8991 taranarak ölçüldü: ürünlerin %11.4'ünde (1023 satır) bu katman aktif ve price'tan farklı - önceki formül bunların hepsini YANLIŞ hesaplıyordu. DÜZELTME 2 (2026-08-02, aynı gün üçüncü tur): ST15010634 (Sea Color) için önce 'index bayat, gerçek sayfa 449 gösteriyor' diye YANLIŞ bir 'bilinen sınırlama' notu yazılmıştı - bu, doğrulama yöntemi olarak sayfanın GA4 'view_item' analytics event'ine (dataLayer) bakılarak çıkarılmıştı, ki bu YANLIŞ sinyal - o event her zaman referans/liste fiyatını (price) loglamış, GERÇEKTE EKRANDA GÖSTERİLEN fiyatı değil. Kullanıcı sayfanın gerçek ekran görüntüsünü paylaşınca netleşti: 449 TL üstü çizili + 225 TL kırmızı, rozetsiz, doğrudan 'Sepete Ekle' - tam formülün öngördüğü gibi. Yani index BAYAT DEĞİLDİ, formül HER ZAMAN doğruydu - hatalı olan benim doğrulama yöntemimdi (analytics JSON'a güvenip gerçek görsel/render edilen sayfaya bakmamak). DERS: bu sitede (ve muhtemelen genel olarak) GA4/dataLayer 'view_item' gibi analytics event'leri 'gerçekte gösterilen fiyat' için GÜVENİLİR DEĞİL - sadece gerçek ekran görüntüsü/sepet tutarı güvenilir kanıt sayılmalı."}
  conditional_promo_price_try: {strategy: computed, formula: "CASE WHEN try_cast(\"_source.crm_price\" AS DOUBLE) > 0 AND try_cast(\"_source.crm_price\" AS DOUBLE) < \"_source.price\" THEN try_cast(\"_source.crm_price\" AS DOUBLE) WHEN (CASE WHEN try_cast(\"_source.cmp_100_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_100_price\" AS DOUBLE) WHEN try_cast(\"_source.cmp_50_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_50_price\" AS DOUBLE) WHEN try_cast(\"_source.cmp_20_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_20_price\" AS DOUBLE) ELSE 0 END) > 0 AND (CASE WHEN try_cast(\"_source.cmp_100_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_100_price\" AS DOUBLE) WHEN try_cast(\"_source.cmp_50_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_50_price\" AS DOUBLE) WHEN try_cast(\"_source.cmp_20_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_20_price\" AS DOUBLE) ELSE 0 END) < \"_source.price\" THEN (CASE WHEN try_cast(\"_source.cmp_100_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_100_price\" AS DOUBLE) WHEN try_cast(\"_source.cmp_50_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_50_price\" AS DOUBLE) WHEN try_cast(\"_source.cmp_20_price\" AS DOUBLE) > 0 THEN try_cast(\"_source.cmp_20_price\" AS DOUBLE) ELSE 0 END) ELSE NULL END", confidence: verified_checkout, note: "'Rossmann Card Fiyatı' (crm_price) - Gratis'in conditional_promo_price_try'ı gibi KOŞULLU: sayfada herkese açık gösteriliyor (üstü çizili + 'Rossmann Card ile X TL') ama GERÇEKTEN Rossmann Card üyeliği/girişi gerektiriyor - kullanıcının canlı sepet testinde giriş yapmadan tam fiyat (179 TL) tahsil edildi. DÜZELTME (2026-08-02): Rossmann'ın kendi JS'inde crm_price'ın ALTINDA 2. bir koşullu katman daha var - cmp_100/50/20_price ('kasa önü kampanyası', sepet tutarı eşiğine bağlı, sayfada 'X TL üzeri alışverişe' rozetiyle gösteriliyor, Gratis'in 250 TL promosyonuna benzer). Öncelik crm_price'ın kendisiyle AYNI (crm varsa o kullanılır, yoksa cmp'ye bakılır - ikisi asla birlikte gösterilmiyor, sitenin kendi displayType() fonksiyonu böyle). N=8991'de crm %72.1 (6484), cmp SADECE crm yokken %0.8 (72) aktif. crm_price string '0.000000' ise indirim yok demek - NULL'a çevrildi."}
  discount_rate: {strategy: computed, formula: "ROUND((1.0 - conditional_promo_price_try / NULLIF(list_price_try, 0)) * 100, 2)", confidence: verified_data, note: "Ham veride hazır bir '_source.discp' alanı VAR ama GÜVENİLMEZ bulundu - gerçek (price-crm_price)/price oranıyla sistematik olarak TUTARSIZ (örn. discp=40 iken gerçek oran %56, crm_price=0 iken bile discp=41 olabiliyor) - KULLANILMADI, doğrudan hesaplandı."}

  stock_status_raw: {strategy: direct_path, path: "_source.mnm_stock_status", confidence: verified_data, note: "metin ('Stokta Var' vb.) - is_in_stock ile birlikte CSV'de %97.5 (350/359) eşleşti, kalan fark doğal stok değişimi (crawl anları farklı)."}
  is_in_stock: {strategy: computed, formula: "\"_source.is_in_stock\" = 1", confidence: verified_data, note: "BIGINT (1/0) bayrak - Watsons'ın bozuk inStockFlag'inin AKSİNE burada güvenilir, CSV'nin 'Stokta Mı?' sütunuyla %97.5 eşleşti (Watsons'ta %0 idi)."}
  stock_qty: {strategy: direct_path, path: "_source.qty", confidence: verified_data, note: "CSV'yle sadece %33.1 birebir eşleşti ama bu BEKLENEN - stok adedi sürekli değişen canlı bir sayaç, aynı anda alınmayan 2 snapshot'ta eşleşmesi zaten olası değil, hata değil."}

  category_path: {strategy: computed, formula: "NULLIF(array_to_string(TRY(list_transform(json_extract(\"_source.breadcrumb\", '$[*].name')[1:-2], x -> trim(x::varchar, '\"'))), ' > '), '')", confidence: verified_data, note: "DÜZELTME (2026-08-02, silver kolon denetimi): NULLIF eklendi. Breadcrumb'ı tek elemanlı olan (yani sadece ürünün kendi adını taşıyan, hiç kategori düğümü olmayan) 16 üründe [1:-2] dilimi boş liste veriyor ve array_to_string BOŞ STRING üretiyordu - aynı kolonda hem '' hem NULL 'veri yok' anlamına geliyordu, bu tutarsızlık. Artık ikisi de NULL. Örnek: ST25020214 breadcrumb='[{\"link\":\"\",\"name\":\"Gillette Sensor3+...\"}]'. ORİJİNAL NOT: breadcrumb, JSON string olarak gelen [{link,name}] dizisi - SON eleman kategori DEĞİL, ürünün kendi adı, [1:-2] ile atılıyor. TÜM veri setinde (8991 satır, 2026-08-02) test edildi: 8974/8991 (%99.81) sorunsuz parse edildi. Kalan 17 satır (%0.19) Rossmann'ın KENDİ veri kalitesi sorunu - breadcrumb'ın son elemanındaki ürün adının başında kaçışsız literal newline (\\n) var, JSON'ı bozuyor (örn. '\"name\":\"\\nMaybelline New York...\"'). TRY() sarmalaması bu satırlarda NULL döndürüyor (crash yerine) - zaten atılacak son elemanın içindeki bozukluk olduğu için içerik kaybı yok, sadece o 17 satırda category_path boş kalıyor."}
