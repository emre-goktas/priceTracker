base_headers:
  Accept: "application/json, text/plain, */*"
  Accept-Language: "tr-TR,tr;q=0.9"
  Referer: "https://www.watsons.com.tr/"
  Origin: "https://www.watsons.com.tr"

rate_limit:
  delay_seconds: 1.5
  max_retries: 3
  retry_backoff_seconds: 2.0

main_categories:
  - {id: "100", name: "Makyaj"}
  - {id: "101", name: "Cilt Bakım"}
  - {id: "102", name: "Saç Bakım"}
  - {id: "103", name: "Kişisel Bakım"}
  - {id: "104", name: "K-Beauty"}
  - {id: "105", name: "Erkek Bakım"}
  - {id: "106", name: "Sağlıklı Yaşam"}
  - {id: "107", name: "Sürdürülebilir Yaşam"}
  - {id: "108", name: "Ev ve Yaşam"}
  - {id: "109", name: "Aksesuar"}
  - {id: "30002", name: "Sürdürülebilir Yaşam (alternatif kod)"}
  - {id: "9000900", name: "Setler"}

category_discovery:
  strategy: own_sitemap_regex
  source_sitemap_contains: "Category"
  url_regex: "/c/([0-9_]+)$"
  main_category_rule:
    depth: 1
    min_child_urls: 1

category_search_api:
  method: GET
  url: "https://api.watsons.com.tr/api/v2/wtctr-spa/search"
  params:
    fields: FULL
    searchType: PRODUCT
    categoryCode: "{category_code}"
    currentPage: "{page}"
    lang: tr_TR
    curr: TRY
  pagination:
    page_param: currentPage
    zero_indexed: true
  response:
    format: json_or_xml
    total_count_path: "pagination.totalResults"
    total_pages_path: "pagination.totalPages"
    items_path: "products"

product_id_field: "code"

field_mapping:
  id: {strategy: direct_path, path: "code", confidence: verified_data, note: "%100 tekil (8788/8788), product_id_field zaten bu"}
  source_sku: {strategy: direct_path, path: "defaultSku", confidence: verified_data, note: "code'un 'BP_' önekisiz hali (örn. code=BP_1409198 -> defaultSku=1409198) - bağımsız bilgi değil, sadece format farkı"}
  ean: {strategy: computed, formula: "string_split(ean, ',')", confidence: plausible_unverified, note: "Watsons ürün sayfasında barkod HİÇ GÖSTERİLMİYOR (kullanıcı birkaç üründe kontrol etti, 'İçerik Bilgisi' bölümünde bile yok) - canlı doğrulama YAPILAMADI. Alan kirli: bazı satırlarda virgülle 2-6 değer zincirlenmiş VE aralarına geçersiz/kısa çöp değerler karışmış (örnek: '8682536035835,201305,8690604013050' - ortadaki 6 haneli, EAN değil). DÜZELTME (2026-08-02): önce 'ilk geçerli parçayı al' planlanmıştı ama kullanıcı 'hangisi işimize yarar bilemiyoruz, liste olarak tutalım' dedi - burada TÜM parçalar (geçersiz olanlar dahil) VARCHAR[] listeye bölünüyor, hangi parçanın gerçek EAN olduğu kararı matching/ean_match.py'ye (regex/checksum doğrulamasıyla) bırakılıyor. 8 haneli '30xxxxxx' desenli değerler (122 satır) gerçek EAN-8 mi yoksa Watsons'ın iç kodu mu belirsiz kaldı."}
  name: {strategy: direct_path, path: "name", confidence: verified_data, note: "%100 dolu ama AYNI ürünün farklı crawl'larda farklı case ile geldiği gözlendi (örn. 'Medicube Age-R Booster Pro Pembe...' vs 'MEDICUBE AGE-R BOOSTER PRO PEMBE') - silver'da normalize edilirken bu tutarsızlık akılda tutulmalı"}
  brand: {strategy: direct_path, path: "masterBrand.name", confidence: verified_data, note: "%99.5 dolu, HER ZAMAN BÜYÜK HARF (Gratis/Rossmann'ın Title Case'inden farklı) - siteler birleştirilirken INITCAP(LOWER(...)) ile normalize edilmeli"}
  url: {strategy: computed, formula: "'https://www.watsons.com.tr' || url", confidence: verified_data, note: "DÜZELTME (2026-08-02, silver kolon denetiminde bulundu): önceden direct_path idi ve silver'a GÖRECELİ path yazıyordu ('/egos-wax-goz-alici-parlaklik-100-ml/p/BP_129763') - diğer 3 sitenin url'i MUTLAK olduğu için aynı kolon sitelere göre farklı anlama geliyordu (kullanılabilir link vs yol parçası). Notta 'base_url + url ile tam URL kurulur' yazıyordu ama bu birleştirme hiçbir yerde YAPILMIYORDU. Artık formülde birleştiriliyor; canlı doğrulandı."}
  image_url: {strategy: direct_path, path: "image_url", confidence: verified_data, note: "DÜZELTME (2026-08-07): normalize.py artık raw_watsons yerine clean_watsons'tan okuyor (bkz. matching/normalize.py başı) - clean_watsons build_clean.py'nin VALUE_CLEAN_OVERRIDES'ıyla ham 'images' listesini ZATEN 'https://www.watsons.com.tr' + images[1].url olarak hesaplayıp 'image_url' adıyla üretiyor, formülü burada TEKRARLAMAYA gerek yok - direct_path yeterli. Eski not: Yol GÖRECELİ (örn. '/medias/sys_master/prd-images/h88/h13/8900148723742/prd-front-129763_195x195/prd-front-129763-195x195.png') - base_url önekiyle birleştirilir, kullanıcı canlı denedi, tarayıcıda gerçek ürün görseli açıldı (2026-08-02 doğrulandı)."}
  currency: {strategy: static, value: "TRY", confidence: verified_data, note: "DÜZELTME (2026-08-05): önce direct_path (price.currencyIso) idi - kullanıcı kararıyla static'e çevrildi (Gratis/Rossmann'taki gibi). Gerekçe: proje kapsamı sadece TR (bkz. CLAUDE.md), price.currencyIso zaten tek değer (%100 TRY) taşıyordu - raw kolonu clean_watsons'a alınmayacak, field_mapping'in ona ihtiyacı kalmamalı."}

  list_price_try: {strategy: direct_path, path: "price.value", confidence: verified_checkout, note: "otherPrices dolu olan (07-29 tipi) satırlarda gerçek/daha yüksek referans fiyatı doğru veriyor (sepetin 'Genel Toplam'ıyla eşleşti). AMA otherPrices boş olan (08-01 tipi) satırlarda bu ALANIN KENDİSİ ZATEN İNDİRİMLİ OLABİLİR - üstündeki gerçek referans (bu örnekte 19999) API'den kayboluyor, sadece sepete gidince görünüyor, bizim crawl'ımız bunu YAKALAYAMIYOR. Yani bu alan 'garanti MSRP' değil, 'API'nin o an gösterdiği en yüksek fiyat' - elimizdeki en iyi yaklaşım budur, kabul edilen sınırlama."}
  sale_price_try: {strategy: computed, formula: "COALESCE(CAST(list_filter(otherPrices, x -> x.priceSource = 'MEMBER')[1].value AS DOUBLE), \"price.value\")", confidence: verified_checkout, note: "DÜZELTME (2026-08-06, uçtan uca pipeline testinde bulundu): CAST eklendi. Kampanya penceresi TÜM arşivde kapalıyken (otherPrices her satırda boş liste - 2026-08-01 ve 2026-08-06 crawl'larında olduğu gibi) DuckDB'nin şema çıkarımı otherPrices'ı gerçek STRUCT(...)[] yerine boş JSON[] olarak tipliyor (hiç gerçek örnek bulamadığı için) - bu durumda list_filter(...)[1].value JSON tipinde dönüyor (DOUBLE değil, görünüşte sayı gibi yazdırılsa da typeof() ile doğrulandı), COALESCE'in DOUBLE olan price.value ile birleşimi downstream discount_rate'teki bölme işleminde 'No function matches /(JSON, DOUBLE)' hatasıyla PATLIYORDU. CAST bu iki durumu da (gerçek STRUCT verisi VE boş/JSON-tipli sütun) DOUBLE'a zorlayarak sağlamlaştırıyor - davranış/değer DEĞİŞMEDİ, sadece tip garantisi eklendi. otherPrices dolu olduğunda ürün SAYFASINDA gösterilen fiyatla BİREBİR eşleşti - 'MEMBER' etiketine rağmen üyelik/login GEREKTİRMİYOR, herkese açık gösterilen fiyat. otherPrices BOŞ olduğunda price.value zaten sayfada gösterilen fiyatın ta kendisi (2 üründe, 2 ayrı tarihte canlı doğrulandı - BP_1458835 07-29'da otherPrices=9999.9 ile, 08-01'de price.value=9999.9 ile, İKİSİ DE aynı sonucu (9999.90) üretti ve ikisi de o günkü canlı sayfayla eşleşti). UYARI - YAKALAYAMADIĞIMIZ bir katman var: sepete ekleyince ('AĞUSTOS ÖZEL GÜN'/'%30 KAZANÇ' gibi isimlerle) ek bir indirim daha uygulanıyor (2/2 testte tam 500 TL) - bu indirim raw_watsons'ın HİÇBİR alanında yok (90 sütun tarandı), API'de hiç görünmüyor, sadece cart-time kampanya. Gratis'in promotionPrice'ının aksine (o en azından API'de vardı) bunu YAKALAMANIN YOLU YOK şu an - gerçek ödenen fiyattan biraz yüksek kalabilir, bilinen/kabul edilen bir sınırlama."}
  discount_rate: {strategy: computed, formula: "ROUND((1.0 - sale_price_try / NULLIF(list_price_try, 0)) * 100, 2)", confidence: plausible_unverified, note: "Watsons ham veride hazır bir indirim yüzdesi alanı yok (Gratis'in discountRate'inin aksine), hesaplanmış. 08-01 itibarıyla otherPrices sitede kapalı olduğu için bu formül şu an neredeyse HER SATIRDA 0 verecek - bu YANLIŞ değil, o günkü gerçek durumu yansıtıyor (kampanya kapalı), ama gelecekte otherPrices yeniden aktifleşirse otomatik doğru değer üretecek şekilde tasarlandı."}

  stock_status_raw: {strategy: direct_path, path: "stock.stockLevelStatus", confidence: verified_data, note: "3 değer: inStock(13436)/lowStock(2283)/outOfStock(4576) (2026-08-01 tam veri), dağılım mantıklı ve 'outOfStock' değeri kullanıcının stokta olmadığını bizzat gördüğü ürünlerde (BP_1458842, BP_103227) canlı doğrulandı"}
  is_in_stock: {strategy: computed, formula: "\"stock.stockLevelStatus\" != 'outOfStock'", confidence: verified_checkout, note: "DÜZELTME (2026-08-02): önce buraya `inStockFlag` yazılmıştı ('verified_checkout' diye işaretlenmişti) ama sadece 2 örnekle test edilmişti, ikisi de TESADÜFEN gerçekten stokta yoktu. Kullanıcının istediği geniş/istatistiksel sorguda `inStockFlag`'in TÜM veri setinde (20295/20295 satır, hem 07-29 hem 08-01) HER ZAMAN False olduğu ortaya çıktı - kullanıcının canlı sepete ekleyip SATIN ALDIĞI bir ürün bile (BP_1458835, stockLevel=4/lowStock) bu alanda False görünüyor. Yani `inStockFlag` bozuk/anlamsız, KULLANILMAMALI. `stock.stockLevelStatus` (Gratis'in stockStatus'üyle aynı desen) gerçek/tutarlı - 'lowStock' durumundaki BP_1458835'in gerçekten satın alınabildiği canlı doğrulandı, bu yüzden Gratis'teki gibi sadece 'outOfStock' hariç her şey stokta sayılır."}
  stock_qty: {strategy: direct_path, path: "stock.stockLevel", confidence: verified_data}

  category_path: {strategy: computed, formula: "replace(regexp_replace(categoryNameHierarchy, '/undefined$', ''), '/', ' > ')", confidence: plausible_unverified, note: "ham veride sondaki segment çöp '/undefined' içeriyordu (satırların %99.9'u) - burada kırpıldı + diğer sitelerle tutarlılık için '/' yerine ' > ' ayracı kullanıldı. Ayrıca ürün-sabiti DEĞİL - aynı ürün 2 farklı kategoriden çekilirse 2 farklı hiyerarşi değeri alabiliyor (Watsons'ın gerçek çoklu-kategori doğası, bkz. product_id_field notu), dedupe sonrası hangi kategori kaldığı rastgele/son-görülen'e bağlı."}
