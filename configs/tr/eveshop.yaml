base_headers:
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
  Accept-Language: "tr-TR,tr;q=0.9"

archive:
  extension: json
  content_type: application/json

rate_limit:
  delay_seconds: 1.5
  max_retries: 3
  retry_backoff_seconds: 2.0

main_categories_html_barkod_icin_gelecek:
  - {id: "makyaj", name: "Makyaj"}
  - {id: "cilt-bakimi", name: "Cilt Bakım"}
  - {id: "sac-bakimi", name: "Saç Bakım"}
  - {id: "parfum-deodorant", name: "Parfüm & Deodorant"}
  - {id: "kisisel-bakim", name: "Kişisel Bakım"}
  - {id: "erkek-bakim", name: "Erkek Bakım"}
  - {id: "anne-bebek", name: "Anne & Bebek"}
  - {id: "ev-yasam", name: "Ev & Yaşam"}
  - {id: "cok-satan-urunler", name: "Çok Satan Ürünler"}

# AŞAĞIDAKİ 3 BLOK (archive/category_search_api/rate_limit, "_html_barkod_icin_gelecek"
# soneki ile), main_categories_html_barkod_icin_gelecek ile birlikte, HTML kaynağının TAM fetch
# tarifi - normal akışta OKUNMUYOR (kod sadece üstteki aktif archive/category_search_api/
# rate_limit'i okur), matching/eveshop_html_supplement.py bunları config_override olarak
# elle birleştirip kullanıyor. 2026-08-06/07'de barkod tazeleme için kullanıldı, sıfır blok
# (2026-08-07: 9 kategori, 440 sayfa, 37.2 dk, delay_seconds=4.0 ile - bkz. aşağıdaki
# rate_limit_html_barkod_icin_gelecek). Önceden (config'e hiç yazılmadan, sadece elle
# kurulmuş bir scriptte) çalıştırılmıştı - tek doğruluk kaynağı ilkesi gereği buraya taşındı.
archive_html_barkod_icin_gelecek:
  extension: html
  content_type: text/html

category_search_api_html_barkod_icin_gelecek:
  method: GET
  url: "https://www.eveshop.com.tr/collections/{category_id}"
  params:
    page: "{page}"
  pagination:
    page_param: page
    zero_indexed: false
  response:
    format: html_regex_json
    extract_regex: "x-labels-data='(\\[.*?\\])'"

# delay_seconds aktif rate_limit'ten (1.5sn) YÜKSEK tutuldu - 2026-08-05'teki WAF blok
# deneyiminden sonra bilerek daha temkinli, 2026-08-07'de bu değerle sıfır blok alındı.
rate_limit_html_barkod_icin_gelecek:
  delay_seconds: 4.0
  max_retries: 3
  retry_backoff_seconds: 3.0

main_categories:
  - {id: "urunler", name: "Tüm Ürünler"}

category_search_api:
  method: GET
  url: "https://www.eveshop.com.tr/products.json"
  params:
    limit: 250
    page: "{page}"
  pagination:
    page_param: page
    zero_indexed: false
  response:
    format: json
    items_path: "products"

raw_html_extraction:
  variant_block_regex: "<script type=['\"]application/json['\"]>\\s*(\\[.*?\\])\\s*</script>"
  product_url_regex: "'(/products/[a-zA-Z0-9\\-]+)',\\s*'(\\d+)'"
  variant_id_field: "id"
  variant_join_key: "variant_id"
  variant_prefix: "variant."
  product_url_join_key: "product_id"
  analytics_regex: '\\"vendor\\":\\"(.*?)\\",\\"id\\":\\"(\d+)\\",\\"untranslatedTitle\\":\\".*?\\",\\"url\\":\\"(.*?)\\",\\"type\\":\\"(.*?)\\"\},\\"id\\":\\"(\d+)\\",\\"image\\":\{\\"src\\":\\"(.*?)\\"\},\\"sku\\":\\"(\d+)\\"'
  analytics_groups: ["brand", "_product_id", "product_url", "category_hierarchy", "_variant_id", "image_url", "_sku"]
  analytics_join_group: "_variant_id"
  analytics_prefixes:
    image_url: "https:"

product_id_field: "id"

field_mapping:
  id: {strategy: direct_path, path: "id", confidence: verified_data, note: "DÜZELTME (2026-08-07): products.json'a geçişle product_id_field 'product_id'den 'id'ye değişti - bu products.json'ın kendi top-level kimlik alanı."}
  source_sku: {strategy: computed, formula: "variants[1].sku", confidence: verified_data, note: "DÜZELTME (2026-08-07): variants artık düz 'variant.sku' kolonu değil, flatten() tarafından açılmayan bir STRUCT[] kolonu - Watsons'ın images[1].url deseniyle aynı şekilde [1] ile erişiliyor. Ürünler tek-varyantlı olduğu (0/7414 çok-varyantlı, tam katalogda doğrulandı) için [1] güvenli. 22 haneli sıfır dolgulu Eveshop'a özel iç kod, id ile sayısal bir ilişkisi yok."}
  ean: {strategy: direct_path, path: "ean_html", confidence: verified_data, note: "DÜZELTME (2026-08-07, HTML-supplement): products.json'da barkod yapısal olarak yok (bkz. eski not). matching/eveshop_html_supplement.py'nin ara sıra çalıştırdığı HTML taraması (main_categories_html_barkod_icin_gelecek, 9 kategori) + matching/analysis/build_clean.py'nin SUPPLEMENT_JOINS'i ile clean_eveshop'a LEFT JOIN edilen ean_html kolonu kullanılıyor - zaten VARCHAR[] (list_value ile sarılmış, diğer sitelerle tip tutarlı). 2026-08-07 taramasında 7292/7414 ürün (%98.4) kapsandı, kalan %1.6 (kategori taramasına hiç düşmemiş ürünler) NULL kalıyor. Tazelik: HTML taraması ne zaman yapılırsa o günün verisi - ürün barkodu pratikte hiç değişmediği için (bkz. eski Eveshop notu, 5 nadir yeniden-markalama istisnası hariç) bu düşük risk."}
  name: {strategy: direct_path, path: "title", confidence: verified_data, note: "%100 dolu. DÜZELTME (2026-08-07): eski HTML kaynağındaki 509 satırlık HTML entity kaçışı sorunu (&#39; vb.) bu kaynakta YOK - products.json gerçek/temiz JSON, tam katalogda (7414) sıfır entity bulundu."}
  brand: {strategy: direct_path, path: "vendor", confidence: verified_data, note: "DÜZELTME (2026-08-07): eski analytics_regex'in (Shopify Web Pixels event'inden kazınan) 'brand' alanının yerini, products.json'ın kendi standart 'vendor' alanı aldı - artık regex'e hiç gerek yok. %100 dolu, aynı değerler (BÜYÜK HARF format)."}
  url: {strategy: computed, formula: "'https://www.eveshop.com.tr/products/' || handle", confidence: verified_checkout, note: "DÜZELTME (2026-08-07): eski product_url_regex'in yerini products.json'ın kendi 'handle' alanı (Shopify standart slug) aldı, regex'e gerek kalmadı. Canlı doğrulandı: https://www.eveshop.com.tr/products/ultra-guclu-sac-kopugu-no-4-150-ml-000000000001028118 -> HTTP 200."}
  image_url: {strategy: computed, formula: "CASE WHEN len(images) > 0 THEN images[1].src ELSE NULL END", confidence: verified_data, note: "DÜZELTME (2026-08-07): eski analytics_regex'in (protokolsüz path) yerini products.json'ın kendi 'images' listesi aldı - images[1].src ZATEN mutlak URL (cdn.shopify.com), önek eklemeye gerek yok. images hiçbir zaman boş değil (0/7414, tam katalogda doğrulandı) ama bazen >1 eleman var (4533/7414) - [1] (position=1) birincil/kapak görseli."}
  currency: {strategy: static, value: "TRY", confidence: verified_data, note: "Değişmedi - Eveshop ham veride ayrı bir currency alanı yok, tüm fiyatlar zaten TL."}

  list_price_try: {strategy: computed, formula: "CAST(variants[1].price AS DOUBLE)", confidence: verified_data, note: "DÜZELTME (2026-08-07, BİRİM DEĞİŞİKLİĞİ): eski HTML kaynağında price BIGINT/kuruş idi (unit: kurus gerekiyordu). products.json'da variants[1].price ZATEN ondalık-TL string olarak geliyor (örn. '418.00') - unit: kurus KALDIRILDI, sadece CAST yeterli. Tam katalogda (7414) doğrulandı: 0 satır CAST'e dirençli, min 1.0 TL, max 13998.0 TL."}
  sale_price_try: {strategy: computed, formula: "CAST(variants[1].price AS DOUBLE)", confidence: verified_data, note: "list_price_try ile AYNI - koşulsuz bir site-geneli indirim katmanı yok, değişmedi. compare_at_price (Shopify'ın standart 'üstü çizili fiyat' alanı) tam katalogda (7414/7414) %100 NULL çıktı (2026-08-07 canlı tarama) - Gratis'in normalPrice/discountedPrice deseni gibi kullanılabilir bir sinyal DEĞİL şu an, formül kurulmadı. İleride dolarsa (list_price_try=compare_at_price, sale_price_try=price şeklinde) yeniden değerlendirilmeli - o zaman compare_at_price'ın da (otherPrices/Watsons emsalinde olduğu gibi) tamamen-boş-sütun JSON-tipleme riskine karşı CAST(...AS DOUBLE) ile sarmalanması gerekecek."}
  conditional_promo_price_try: {strategy: direct_path, path: "eve_price_html", unit: kurus, confidence: verified_data, note: "DÜZELTME (2026-08-07, HTML-supplement): eve_price ('EVE KART+'A ÖZEL' fiyatı) products.json'da yok ama HTML-supplement'ta (bkz. ean notu) var - eve_price_html zaten kuruş cinsinden (eski HTML kaynağıyla AYNI birim, unit:kurus gerekli - canlı doğrulandı: örn. eve_price_html=39600 (kuruş) / list_price_try=528.0 TL karşılaştırıldı, 396.00 TL < 528.0 TL, mantıklı kart-indirimi). Supplement tablosu kurulurken zaten 0'sa NULL'a çevrilmiş (KART indirimi yok demek). Kapsam ean ile aynı (%98.4, 2026-08-07 taraması) - kapsanmayan üründe NULL."}
  discount_rate: {strategy: computed, formula: "ROUND((1.0 - conditional_promo_price_try / NULLIF(list_price_try, 0)) * 100, 2)", confidence: verified_data, note: "DÜZELTME (2026-08-07): girdisi (conditional_promo_price_try) HTML-supplement ile geri geldiği için formül yeniden kuruldu. Kapsanmayan üründe (conditional_promo_price_try NULL) sonuç da NULL - hata değil, eksik veri."}

  stock_status_raw: {strategy: none, confidence: plausible_unverified, note: "Değişmedi - çok-değerli bir stok metni yok, sadece boolean var."}
  is_in_stock: {strategy: computed, formula: "variants[1].available", confidence: verified_data, note: "DÜZELTME (2026-08-07): eski top-level 'available' alanı products.json'da YOK, sadece variant içinde (variants[1].available). Tek-varyantlı yapı nedeniyle pratikte 1:1, davranış değişmedi."}
  stock_qty: {strategy: direct_path, path: "qty_html", confidence: verified_data, note: "DÜZELTME (2026-08-07, HTML-supplement): eski HTML kaynağındaki 'qty' (tam stok sayısı) products.json'da yok ama HTML-supplement'ta var (bkz. ean notu). UYARI: stok adedi sürekli değişen canlı bir sayaç - HTML taraması ne zaman yapıldıysa o ANIN değeri, products.json'un kendi güncelleme sıklığından (günde birkaç kez) daha BAYAT olabilir (HTML taraması 'ara sıra' çalışıyor). Kapsam ean ile aynı (%98.4)."}

  category_path: {strategy: computed, formula: "regexp_replace(product_type, '^Eve Genel Hiyerarşi\\s*>\\s*', '')", confidence: verified_data, note: "DÜZELTME (2026-08-07): eski analytics_regex'in 'category_hierarchy' alanının yerini products.json'ın kendi 'product_type' alanı aldı - AYNI kök-önek deseni (7414/7414 'Eve Genel Hiyerarşi' ile başlıyor, canlı arşivde doğrulandı), aynı regex kırpma mantığı çalışıyor."}
