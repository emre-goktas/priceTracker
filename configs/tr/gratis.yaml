# Gratis fetch-özel config. Kapsam: sitenin TAMAMI (kategori filtresi yok).
# Doğrulandı: curl_cffi (impersonate=chrome120) ile 200 OK, tek istekte EAN+fiyat+stok geliyor.
# Regex/kategori ID gibi kırılgan bilgiler burada (YAML) yaşar, core/parsers/site_plugins/gratis.py
# içine literal olarak gömülmez — self-heal sadece bu dosyayı güncelleyebildiği için (bkz. CLAUDE.md).

base_headers:
  Accept: "application/json, text/plain, */*"
  Accept-Language: "tr-TR,tr;q=0.9"

# Ana kategori ID listesi HARDCODE EDİLMEZ: aşağıdaki endpoint'ten çalışma zamanında canlı
# keşfedilir. Gratis yeni bir ana kategori ekler/kaldırırsa hiçbir müdahale gerekmez.
category_discovery_api:
  method: GET
  url: "https://api.gratis.retter.io/1oakekr4e/CALL/Search/homepageProducts/default"
  extra_params:
    __culture: tr_TR
    __platform: WEB
  response:
    # salesCountData ve newProductsData aynı kategori ID setini anahtar olarak taşıyor;
    # "all" gerçek bir kategori değil, toplu/varsayılan bölüm — hariç tutulur.
    category_ids_path: salesCountData
    exclude_keys: ["all"]

category_search_api:
  method: GET
  url: "https://api.gratis.retter.io/1oakekr4e/CALL/Search/search/default"
  extra_params:
    __culture: tr_TR
    __platform: WEB
  # payload base64 encode edilip 'data' query param'ına, ayrıca '__isbase64=true' eklenir:
  request_style: base64_json_payload
  payload_template:
    query:
      from: "{offset}"
      size: "{limit}"
      filters:
        - filterId: categories
          filterValues: ["{category_id}"]
      searchTerm: ""
      sortBy: []
  pagination:
    page_size: 100
  response:
    total_count_path: itemCount
    items_path: data
    format: json

# Ürün objesinden alan çıkarma — hepsi düz (dotted-path) erişim, ayrı bir çıkarım mantığı
# gerekmiyor (doğrulandı: category_search_api'de attributes zaten düz dict, array-of-key-value
# DEĞİL — eski/kullanılmayacak Product/getProductDetail endpoint'inde öyleydi, burada değil).
field_mapping:
  ean: {strategy: direct_path, path: "attributes.eanUpc"}
  # NOT: prices.discountedPrice/normalPrice kuruş cinsinden integer gelir (52900 = 529,00 TL).
  price: {strategy: direct_path, path: "prices.discountedPrice", unit: kurus}
  list_price: {strategy: direct_path, path: "prices.normalPrice", unit: kurus}
  currency: {strategy: direct_path, path: "prices.currency"}
  stock_status: {strategy: direct_path, path: "stockStatus"}
  name: {strategy: direct_path, path: "attributes.displayName"}
  brand: {strategy: direct_path, path: "attributes.brand"}
  category_path: {strategy: direct_path, path: "attributes.categories"}
  url: {strategy: direct_path, path: "shareLink"}
