# Gratis fetch-özel config. Kapsam: sitenin TAMAMI (kategori filtresi yok).
# Doğrulandı: curl_cffi (impersonate=chrome120) ile 200 OK, tek istekte EAN+fiyat+stok geliyor.
# Regex/kategori ID gibi kırılgan bilgiler burada (YAML) yaşar, core/parsers/site_plugins/gratis.py
# içine literal olarak gömülmez — self-heal sadece bu dosyayı güncelleyebildiği için (bkz. CLAUDE.md).

base_headers:
  Accept: "application/json, text/plain, */*"
  Accept-Language: "tr-TR,tr;q=0.9"

# Sayfalar/kategoriler arası bekleme + retry — hardcode değil, buradan okunur (bkz.
# core/parsers/base_parser.py). Ampirik olarak gözlemlendi: throttle'sız art arda istekte
# Gratis WAF'ı 11 sayfayı 403 ile bloklamıştı; delay_seconds ile tekrar denendiğinde 0 blok.
rate_limit:
  delay_seconds: 1.5
  max_retries: 3
  retry_backoff_seconds: 2.0

# Ana kategori ID'leri artık statik (main_categories) — bunlar veritabanı/API key'i,
# kolay kolay değişmez. Çalışma zamanında her seferinde canlı keşfe gerek yok.
#
# category_discovery aşağıda REFERANS olarak duruyor (bu ID listesinin nasıl doğrulandığının
# kaydı) ve normal fetch akışında ÇALIŞTIRILMAZ; selfheal katmanında kategori drift kontrolü
# (Gratis yeni bir ana kategori ekler/kaldırırsa fark etmek) için değerlendirilecek.
main_categories:
  - {id: "501", name: "Makyaj"}
  - {id: "502", name: "Cilt Bakım"}
  - {id: "503", name: "Saç Bakım"}
  - {id: "504", name: "Parfüm & Deodorant"}
  - {id: "505", name: "Erkek Bakım"}
  - {id: "506", name: "Kişisel Bakım"}
  - {id: "507", name: "Anne & Bebek"}
  - {id: "508", name: "Ev & Yaşam"}
  - {id: "509", name: "Moda & Aksesuar"}
  - {id: "510", name: "Süpermarket"}
  - {id: "511", name: "Elektrikli Ürünler"}
  - {id: "514", name: "Duş & Banyo"}
  - {id: "515", name: "Hijyen & Bakım"}
  - {id: "516", name: "Güneş Ürünleri"}

category_discovery:
  strategy: dynamic_api
  method: GET
  url: "https://api.gratis.retter.io/1oakekr4e/CALL/Search/homepageProducts/default"
  extra_params:
    __culture: tr_TR
    __platform: WEB
  response:
    # salesCountData ve newProductsData aynı kategori ID setini anahtar olarak taşıyor;
    # "all" gerçek bir kategori değil, toplu/varsayılan bölüm — hariç tutulur.
    category_ids_path: salesCountData
    exclude_keys: ["all"]

category_search_api:
  method: GET
  url: "https://api.gratis.retter.io/1oakekr4e/CALL/Search/search/default"
  extra_params:
    __culture: tr_TR
    __platform: WEB
  # payload base64 encode edilip 'data' query param'ına, ayrıca '__isbase64=true' eklenir:
  request_style: base64_json_payload
  # payload_template gerçek tarayıcı isteğiyle (Chrome DevTools Network, 2026-08-01) eşleştirildi
  # - inStock/filterActiveProducts/fromHomepageBestsellers eskiden hiç GÖNDERİLMİYORDU, eklendi.
  # size alanı BİLEREK gerçek siteden farklı (site 24 kullanıyor, biz 100) - aşağıdaki pagination
  # notuna bak, size'ın kayıp oranına etkisi yok, 100 daha az istekle aynı işi görüyor.
  #
  # sortBy KRİTİK - boş bırakılırsa (gerçek sitenin de yaptığı gibi!) Gratis'in arama motorunun
  # sıralaması KARARSIZ: aynı ürün ardışık sayfalarda tekrar edip başka ürünlerin hiç
  # görünmemesine sebep oluyor (doğrulandı 2026-08-01: kategori 516'da 258 üründen 54'ü
  # kaçıyordu, 11 sayfa boyunca deterministik/tekrarlanabilir - CDN/rastgelelik değil, sıralama
  # kararsızlığı).
  #
  # KESİN DOĞRULANDI (2026-08-01): `attribute: createdAt, order: asc` ile hem küçük (516,
  # 258/258 ürün) hem EN BÜYÜK kategoride (501 Makyaj, 197 sayfa, 4725/4725 ürün) SIFIR tekrar +
  # SIFIR kayıp - tam kod yolu (base_parser.fetch_category_pages) üzerinden test edildi, üretim
  # gecikmesiyle (1.5s) çalıştı. Bu, GERÇEK sitenin gönderdiğinden farklı (site sortBy:[]
  # gönderiyor) ama kasıtlı - amacımız (eksiksiz veri) normal bir kullanıcının amacından
  # (birkaç sayfa gezip ürün bulma) farklı, kararsız sıralama onlar için sorun değil bizim için
  # eksik veri demek. `sortBy` şeması API'nin 400 validasyon hatalarından adım adım çıkarıldı
  # (field->attribute, order zorunlu). Kabul edilen diğer alan: displayName.keyword (createdAt
  # tercih edildi, muhtemelen benzersiz zaman damgası - displayName'de teorik çakışma riski var).
  payload_template:
    query:
      searchTerm: ""
      from: "{offset}"
      size: "{limit}"
      filters:
        - filterId: categories
          filterValues: ["{category_id}"]
      inStock: false
      sortBy:
        - attribute: createdAt
          order: asc
      filterActiveProducts: true
      fromHomepageBestsellers: false
  # page_size=100 (24 DEĞİL - gerçek sitenin kullandığı değer, kasıtlı farklılaştırıldı):
  # 2x2 izole test (core/debug/pagination_test.py, matching/exploration/pagination_findings.md,
  # 2026-08-01) kanıtladı ki kayıp oranını belirleyen TEK FAKTÖR sortBy - page_size'ın ölçülebilir
  # etkisi yok (sort YOK: size 100 -> %20.76 kayıp, size 25 -> %20.61 kayıp, neredeyse aynı; sort
  # VAR: size 100 -> %0.02 kayıp, size 25 -> %0.17 kayıp - size 100 hatta biraz DAHA tam). Aynı
  # kategoride (501, 4725 ürün) size=100 SADECE 48 istek gerektirirken size=25 189 istek
  # gerektiriyordu (~4x fazla) - aynı/daha iyi sonuç için gereksiz yere Gratis'in sunucusuna
  # fazladan yük binmesin diye 100'e geri dönüldü.
  pagination:
    page_size: 100
  response:
    total_count_path: itemCount
    items_path: data
    format: json

# matching/duckdb_pipeline.py'nin dedup adımı için: ham üründe kararlı/benzersiz kimlik hangi
# alanda (flatten sonrası sütun adı). Aynı ürün, sayfalama sırasında sunucu sıralaması kayması
# yüzünden 2 farklı sayfada çıkabiliyor (doğrulandı, 2026-07-30) - bu alan üzerinden dedupe edilir.
product_id_field: "id"

# field_mapping — 2026-08-01'de YENİDEN yazıldı (önceki sürüm bu oturumda daha erken silinmişti:
# hiçbir kod tarafından tüketilmiyordu ve içeriği doğrulanmamıştı, bkz. proje geçmişi). Bu sefer
# her satır gerçek veriyle doğrulandı: clean_gratis tablosu (10402 satır) + canlı sayfa + GERÇEK
# SEPET/CHECKOUT testi (fiyat alanları için — en güçlü kanıt). confidence alanı üç seviye:
#   verified_checkout   -> gerçek sepete eklenip sonuç doğrulandı (sadece fiyat alanları)
#   verified_data       -> clean_gratis'teki gerçek veriyle (doluluk/değer aralığı) doğrulandı
#   plausible_unverified -> mantıklı ama canlı sitede bizzat çapraz kontrol edilmedi
field_mapping:
  id: {strategy: direct_path, path: "id", confidence: verified_data}
  ean: {strategy: direct_path, path: "attributes.eanUpc", confidence: verified_data}
  name: {strategy: direct_path, path: "attributes.displayName", confidence: verified_data}
  brand: {strategy: direct_path, path: "attributes.brand", confidence: verified_data, note: "%100 dolu - Watsons'ın TÜMÜ BÜYÜK HARF biçiminden farklı, burada Title Case geliyor, siteler birleştirilirken normalize edilmeli"}
  url: {strategy: direct_path, path: "shareLink", confidence: verified_data, note: "GERÇEK/çalışan URL zaten burada - id'den '/p/{id}' gibi bir formülle YENİDEN KURMAYA ÇALIŞMAYIN (test edildi, yanlış/kırık link üretir), shareLink tam SEO slug'ını zaten içeriyor"}
  currency: {strategy: direct_path, path: "prices.currency", confidence: verified_data}

  # --- Fiyat: 4 canlı örnek + GERÇEK SEPET/CHECKOUT testiyle doğrulandı (2026-08-01) ---
  list_price_try: {strategy: direct_path, path: "prices.normalPrice", unit: kurus, confidence: verified_checkout, note: "üstü çizili referans fiyat"}
  sale_price_try: {strategy: direct_path, path: "prices.discountedPrice", unit: kurus, confidence: verified_checkout, note: "KOŞULSUZ gerçek fiyat - schema.org'un offers.price'ı ile 3/3 canlı örnekte birebir eşleşti. Gün gün kıyaslamak (fiyat takibinin asıl amacı) için GÜVENİLİR/stabil alan bu."}
  conditional_promo_price_try: {strategy: direct_path, path: "prices.promotionPrice", unit: kurus, confidence: verified_checkout, note: "KOŞULLU fiyat (\"Gratis Kart ile\" / \"250 TL ve Üzeri Alışverişe\" - Gratis Kart sitede alışveriş için zorunlu). sale_price_try > 250 TL ise bu fiyat TEK ÜRÜNLE bile garanti ulaşılabilir (checkout'ta doğrulandı: 838 TL ürün sepette gerçekten 209,50 TL'ye düştü, 'Promosyon Kazancınız: -628,50 TL' olarak gösterildi). sale_price_try <= 250 TL ise bu alan sadece ÖNİZLEME - sepetin geri kalanına bağlı, garanti değil (aynı ürün farklı günlerde promosyonsuz da görülebiliyor, doğrulandı). discountedText/promotionLabel metin alanları HER ZAMAN dolu geliyor (statik şablon) - promosyonun GERÇEKTEN var olup olmadığına bu metne bakarak değil, promotionPrice != discountedPrice karşılaştırmasına bakarak karar verin."}
  discount_rate: {strategy: direct_path, path: "prices.discountRate", confidence: verified_data}

  stock_status_raw: {strategy: direct_path, path: "stockStatus", confidence: verified_data, note: "4 değer: HIGH(4296)/NONE(2829)/LOW(1853)/MEDIUM(1424) - clean_gratis'te doğrulandı, toplam tutuyor"}
  is_in_stock: {strategy: computed, formula: "stock_status_raw != 'NONE'", confidence: plausible_unverified, note: "mantıklı varsayım (NONE=stokta yok) ama canlı sitede 'tükendi' etiketiyle bizzat çapraz kontrol EDİLMEDİ - normalize.py yazılırken bir kez doğrulanmalı"}

  category_path: {strategy: computed, formula: "array_to_string(\"attributes.categories\", ' > ')", confidence: plausible_unverified, note: "attributes.categories ham veride array (örn. ['Makyaj','Dudak Makyajı','Dudak Kalemi']) - silver'da diğer sitelerle tip tutarlılığı için (Rossmann/Watsons/Eveshop hepsi VARCHAR döndürüyor) ' > ' ile tek string'e çevrildi. configs/taxonomy/mappings/gratis.yaml'daki category_path_overrides orijinal array haline (raw_gratis'ten) ayrıca erişiyor, bu dönüşümden etkilenmez."}
