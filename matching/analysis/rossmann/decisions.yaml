# Rossmann (raw_rossmann) kolon denetimi (2026-08-03).
#
# Gratis'te öğrenilen dersler burada baştan uygulandı:
#   - clean_rossmann'ın TEK işi raw_rossmann'ı (delete kovası çıkarılmış haliyle) birebir kolon
#     adlarıyla yansıtmak + SADECE gerçekten kirli/parse edilemeyen alanların DEĞERİNİ temizlemek.
#     İsim değişikliği YOK, birim/tip dönüşümü YOK - o field_mapping'in (sonraki, ayrı adım) işi.
#   - Üç kova: delete (raw_rossmann'dan TAMAMEN silinecek, mekanik liste rossmann_at.json'da
#     olacak) / keep (clean_rossmann'da duruyor, field_mapping'e girip girmeyeceği kullanıcı
#     kararı) / use (zaten configs/tr/rossmann.yaml field_mapping'inde kullanılıyor).
#
# analysis: gerçek SQL sorgusuyla doğrulanmış bulgu. reason: kararın kısa gerekçesi.
# target: SADECE ileride field_mapping yazılırken referans - clean_rossmann kurulumunda
#         kullanılmaz, kolon adını DEĞİŞTİRMEZ. 'use' kovasındaki target'lar zaten
#         rossmann.yaml field_mapping'inde YAZILI OLAN kararlardır (yeni analiz değil).
#
# columns.csv bu dosyanın HAM veri kaynağı - python -m matching.analysis.profile_columns rossmann
# ile yeniden üretilir.
#
# NOT: rossmann_at.json henüz oluşturulmadı - kullanıcı gratis'teki gibi decisions.yaml'ı
# gözden geçirip kendi silme listesini oluşturacak.
#
# SON GÜNCELLEME (2026-08-05): clean_rossmann'ın kolon seti KESİNLEŞTİ.
#   Kullanıcı kendi delete kovasını matching/analysis/rossmann/at_rossmann.json'da oluşturdu
#   (rossmann_at.json = mekanik/ilk taslak, at_rossmann.json = kullanıcının onayladığı asıl liste,
#   3 turda 65 satıra genişledi, son satırda "ihtiyacım yok, bu son hali" onayı verildi).
#
#   TUR 1 (43 kolon silindi, 92 -> 49): rossmann_at.json'daki 55 kolondan 38'i + önceden 'keep'
#   kovasındaki 5 kolon (additive_material, origin, tax_class_id, rating, rating_count ->
#   bkz. 'kullanici_ek_karar_2026_08_05').
#
#   TUR 2 (14 kolon daha silindi, 49 -> 35): 11'i TUR 1'de bekleyen mekanik liste kalıntısıydı
#   (_position_, name_sort, paths, paths_label, sac_bakim_rutin, sac_kaygi, sac_teliniz,
#   sac_tip_deriniz, sac_turu, sac_urun_tipi, spec). 3'ü YENİ, mekanik listede hiç yoktu, önceden
#   'keep' kovasındaydı: _source.name2, _source.categories_ids, _source.rating_summary.
#
#   TUR 3 / SON (5 kolon daha silindi, 35 -> 30): _source.sac_rengi, _source.urun_tipi, sort
#   (mekanik listede bekleyen kalıntı) + _source.additional_images, _source.reviews_count (YENİ,
#   önceden 'keep'). field_mapping kontrolü (her yeni-eklenen kolon için, kullanıcının "wired ise
#   sor" talimatı gereği): additive_material, origin, tax_class_id, rating, rating_count, name2,
#   categories_ids, rating_summary, additional_images, reviews_count - HİÇBİRİ
#   configs/tr/rossmann.yaml field_mapping'inde wired değil, silmeden önce sormaya gerek kalmadı.
#
#   raw_rossmann + clean_rossmann ŞU AN 30 KOLON, 26952 satır (clean_rossmann raw_rossmann'ın
#   birebir kopyası olarak yeniden kuruldu). Kalan 3 kolon (_source.discp, _source.freight,
#   _source.ross_60_price_web) kullanıcı kararıyla 'keep'e taşındı - AI'ın 'sil' önerisine rağmen
#   kullanıcı SON listesine yazmadı, field_mapping aşamasında (tüm siteler bitince) tekrar
#   değerlendirilecek. 'use' kovası (field_mapping'e hangi keep-kolonun gireceği) HENÜZ
#   kesinleşmedi - tüm siteler bu şekilde bitince topluca oluşturulacak.
#
#   raw_rossmann şu an 35 kolon, 26952 satır. GEÇİCİ bir çalışma tablosu durumu - raw_rossmann
#   zaten MinIO'dan `duckdb_pipeline --full-refresh` ile tam-kolonlu (92) yeniden kurulabilir,
#   kalıcı bir veri kaybı değil.

columns:

  delete:

    # Elasticsearch/arama motoru iç metadata'sı, ürünle ilgisi yok
    es_ic_veri:
      - _id
      - _index
      - _score
      - _source._position_
      - _source.entity_id
      - _source.name_sort
      - sort

    # Tüm veri setinde sabit tek değer ya da başka bir kullanılan alanın birebir kopyası
    sabit_veya_kopya:
      - _source.branding
      - _source.hair_effect
      - _source.popularite
      - _source.quantity_and_stock_status
      - _source.type_id
      - _source.visibility

    # breadcrumb (kullanılan) veya categories_ids (saklanan) ile aynı bilgiyi taşıyan, daha az düzenli/okunabilir tekrar
    kategori_verisi_zaten_var:
      - _source.paths
      - _source.paths_label

    # Pazarlama rozeti veya iç sistem/widget bayrağı, ürün özelliği değil
    pazarlama_rozeti_ic_bayrak:
      - _source.bestseller_product_widget_status
      - _source.delist
      - _source.german_quality
      - _source.label1
      - _source.label2
      - _source.label3
      - _source.label4
      - _source.new_product_label
      - _source.new_product_widget_status
      - _source.only_rossmann
      - _source.original_perfume

    # Gerçek kozmetik/kişisel bakım özelliği ama şimdilik kapsam dışı (Gratis'teki aynı isimli kovayla tutarlı)
    kozmetik_ozellik_kapsam_disi:
      - _source.agec
      - _source.bakim_turu
      - _source.cilt_bakim_oneri
      - _source.cilt_bakim_rutin
      - _source.cilt_kaygi
      - _source.cilt_tipi
      - _source.ctype
      - _source.factor
      - _source.gender
      - _source.htype
      - _source.sac_bakim_oneri
      - _source.sac_bakim_rutin
      - _source.sac_ek_filtre
      - _source.sac_kaygi
      - _source.sac_rengi
      - _source.sac_teliniz
      - _source.sac_tip_deriniz
      - _source.sac_turu
      - _source.sac_urun_tipi
      - _source.smell_type
      - _source.spec
      - _source.stype
      - _source.urun_tipi
      - _source.utype

    # Muğlak/düşük değerli, derinlemesine analiz edilmedi
    belirsiz_dusuk_deger:
      - _source.height
      - _source.size

    # Kullanıcının kendi delete kovası (at_rossmann.json, 2026-08-05) ile eklenen, önceden
    # 'keep' kararı verilmiş kolonlar - kullanıcı kararı revize etti, field_mapping'e
    # girmeyeceklerine karar verdi.
    kullanici_ek_karar_2026_08_05:
      - _source.additive_material
      - _source.origin
      - _source.tax_class_id
      - _source.rating
      - _source.rating_count

    # TUR 2 (at_rossmann.json 44-60. satırlar) - mekanik listede hiç yoktu, önceden 'keep'
    # kovasındaydı. field_mapping'de wired değil (kontrol edildi, bkz. yukarıdaki güncelleme).
    kullanici_ek_karar_2026_08_05_tur2:
      - _source.name2
      - _source.categories_ids
      - _source.rating_summary

    # TUR 3 / SON (at_rossmann.json 61-65. satırlar, 2026-08-05) - clean_rossmann'ın SON kolon
    # kararı burada verildi. sac_rengi/urun_tipi/sort zaten yukarıdaki mekanik kovalarda vardı
    # (artık fiilen de silindi). additional_images ve reviews_count YENİ - önceden 'keep'
    # kovasındaydı, field_mapping'de wired değil (kontrol edildi).
    kullanici_son_karar_2026_08_05_tur3:
      - _source.additional_images
      - _source.reviews_count

  keep:
  - path: _source.created_at
    analysis: "Ürün oluşturulma zaman damgası - 'yeni ürün' analizinde işe yarayabilir."
  - path: _source.master_category_id
    analysis: "Tek bir ana kategori ID'si, stabil."
  - path: _source.max_sale_qty
    analysis: "Sipariş başına maksimum adet, GERÇEKTEN değişken (3/10/10000 gibi) - sabit değil."
  - path: _source.name1
    analysis: >-
      name'in markasız/varyantsız hali (örn. 'Fondöten') - name2 ile birlikte name'i bileşenlerine
      ayırıyor.
  - path: _source.sold
    analysis: >-
      Rossmann'ın dahili satış/popülerlik sayacı - gratis.analytics.salesCount ile AYNI kategori,
      kullanıcının o alan için verdiği kararla (dinamik analitik tablosu için saklama) tutarlılık
      amacıyla buraya kondu. NOT: 2026-08-02'de bu alanda bir günlük index-yeniden-kurulum bozulması
      tespit edilmişti (bkz. proje hafızası) - kullanılacaksa o günün verisi dikkatli ele alınmalı.
  - path: _source.discp
    analysis: >-
      AI önerisi 'sil' idi (bkz. eski guvenilmez_hesaplama notu: 'İndirim oranı, gerçek oranla
      sistematik tutarsız, doğrudan hesaplanan discount_rate kullanılıyor') ama kullanıcı SON
      kararında (2026-08-05, at_rossmann.json) bunu delete listesine YAZMADI - şimdilik keep,
      field_mapping'e girip girmeyeceği ileride (tüm siteler bitince use kovası kurulurken)
      tekrar değerlendirilecek.
  - path: _source.freight
    analysis: >-
      Kullanıcı notu (2026-08-05, rossmann_at.json üzerine yazıldı): "adet-hacim bilgisi var" -
      sadece kargo/navlun değil ürün adet/hacim verisi taşıyor olabilir şüphesi var. Kullanıcı
      SON kararında delete listesine yazmadı - keep, field_mapping aşamasında içerik incelenecek.
  - path: _source.ross_60_price_web
    analysis: >-
      AI önerisi 'sil' idi (ross_60_price'ın web görünümü kopyası şüphesiyle, doğrulanmadı) ama
      kullanıcı SON listesine yazmadı - keep, field_mapping aşamasında ross_60_price ile
      karşılaştırılıp gerçekten kopya mı diye teyit edilecek.
  use:
  - path: _category_folder
    analysis: "MinIO obje yolundan türetilen crawl-zamanı meta veri, %100 dolu, 7 farklı değer (main_categories sayısı)."
    reason: "Provenance - hangi kategoriden geldiği izlenebilir kalmalı."
  - path: _fetch_date
    analysis: "Crawl tarihi, %100 dolu."
    reason: "Günlük özet/rapor için okunabilir tarih - DÜZELTME (2026-08-11): dedupe/geçmiş partition anahtarı artık _ingested_at, bu alan değil (gün-içi/intraday takip için değişti, bkz. _ingested_at notu)."
  - path: _ingested_at
    analysis: "Pipeline çalıştırma zaman damgası (2026-08-11 eklendi, gün-içi takip için), %100 dolu."
    reason: "silver_products'ın artık dedupe/geçmiş partition anahtarı bu - _fetch_date değil. Günde N çalıştırmanın her biri kendi satırını korur."
  - path: _row_id
    analysis: "Ham tablodaki satır kimliği, %100 dolu, benzersiz."
    reason: "Silver dedupe'ında deterministik sıralama anahtarı."
  - path: _source_object
    analysis: "MinIO obje adı, %100 dolu."
    reason: "Provenance - hangi arşiv dosyasından geldiği izlenebilir kalmalı."
  - path: _source.id
    target: source_product_id
    analysis: "product_id_field zaten bu, sayısal Magento entity ID."
    reason: "Ürün kimliği."
  - path: _source.sku
    target: source_sku
    analysis: "N=364 CSV karşılaştırmasında dolaylı doğrulandı."
    reason: "Site içi SKU."
  - path: _source.barcode
    target: ean
    analysis: "364/364 (%100) CSV'nin 'Barkod' sütunuyla birebir eşleşti."
    reason: "Barkod - en güvenilir EAN kaynağımız."
  - path: _source.name
    target: name
    analysis: "364/364 (%100) birebir eşleşti. UYARI: en az 1 üründe gizli UTF-8 BOM karakteri var."
    reason: "Ürün adı."
  - path: _source.brand
    target: brand
    analysis: "%100 dolu."
    reason: "Marka adı."
  - path: _source.url_key
    target: url
    analysis: >-
      Tam slug, base_url + '/' ile birleştiriliyor, canlı doğrulandı. Formül (configs/tr/rossmann.yaml
      field_mapping, satır 135): 'https://www.rossmann.com.tr/' || "_source.url_key" - url_key
      zaten TAM slug (örn. 'babydream-bebek-alt-degistirme-ortusu-10-adet-p-sr12062947'), sadece
      base_url + '/' eklemek yeterli.
    reason: "Ürün sayfası URL'i."
  - path: _source.image
    target: image_url
    analysis: >-
      Göreli path (örn. '/4/2/426e14f0....jpeg'). Formül (configs/tr/rossmann.yaml field_mapping,
      satır 136): 'https://www.rossmann.com.tr/media/catalog/product' || "_source.image" - canlı
      doğrulandı (2026-08-05), HEAD isteği 200 image/jpeg, 62404 byte (TAM/orijinal çözünürlük).
      NOT: kullanıcının devtools'ta gördüğü 'cdn.rossmann.com.tr/mnresize/126/126/...' deseni bu
      DEĞİL - o, sitenin listeleme sayfasında kullandığı 126x126 küçük thumbnail'i üreten ayrı bir
      resize-proxy (aynı path'le denendi: 200 ama sadece 6033 byte). Mevcut formül daha doğrusu,
      tam boyutlu orijinali veriyor - değişiklik gerekmiyor.
    reason: "Ürün görseli."
  - path: _source.price
    target: list_price_try
    analysis: "CSV 'Standart Fiyat' ile %99.7 eşleşti, sepette doğrulandı."
    reason: "Referans/liste fiyatı."
  - path: _source.ross_60_price
    target: sale_price_try (bileşen)
    analysis: "price'tan düşükse rozetsiz/koşulsuz gösteriliyor - canlı doğrulandı."
    reason: "Koşulsuz indirim katmanı."
  - path: _source.special_price
    target: sale_price_try (bileşen)
    analysis: "ross_60_price boşsa fallback."
    reason: "Koşulsuz indirim katmanı (2. öncelik)."
  - path: _source.crm_price
    target: conditional_promo_price_try (bileşen)
    analysis: "Rossmann Card'a GERÇEKTEN koşullu - canlı sepette doğrulandı."
    reason: "Koşullu kart fiyatı."
  - path: _source.cmp_100_price
    target: conditional_promo_price_try (bileşen)
    analysis: "Sepet-eşiği kampanyası, crm yoksa devreye giriyor."
    reason: "Koşullu kasa-önü fiyatı."
  - path: _source.cmp_50_price
    target: conditional_promo_price_try (bileşen)
    analysis: "cmp_100 ile aynı mekanizma, farklı eşik."
    reason: "Koşullu kasa-önü fiyatı."
  - path: _source.cmp_20_price
    target: conditional_promo_price_try (bileşen)
    analysis: "cmp_100 ile aynı mekanizma, farklı eşik."
    reason: "Koşullu kasa-önü fiyatı."
  - path: _source.mnm_stock_status
    target: stock_status_raw
    analysis: "CSV ile %97.5 eşleşti."
    reason: "Stok durumu metni."
  - path: _source.is_in_stock
    target: is_in_stock
    analysis: "CSV'nin 'Stokta Mı?' sütunuyla %97.5 eşleşti."
    reason: "Stok bayrağı."
  - path: _source.qty
    target: stock_qty
    analysis: "Sürekli değişen canlı sayaç, CSV ile %33.1 eşleşmesi beklenen/normal."
    reason: "Stok adedi."
  - path: _source.breadcrumb
    target: category_path
    analysis: "8974/8991 (%99.81) sorunsuz parse edildi, TRY() ile güvenceye alındı."
    reason: "Kategori hiyerarşisi."
