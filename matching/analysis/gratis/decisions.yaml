# Gratis (raw_gratis) kolon denetimi - SADELEŞTİRİLMİŞ YAPI (2026-08-03).
#
# ÖNEMLİ DÜZELTME (2026-08-03, aynı gün): clean_gratis'in kanonik alanlara yeniden adlandırıp
# (id->source_product_id gibi) field_mapping formüllerini (birim dönüşümü, struct->URL çıkarma,
# dizi birleştirme) UYGULADIĞI bir ilk sürüm vardı - kullanıcı bunu YANLIŞ buldu: "bi adım ileri
# gitmişsin". clean_gratis'in TEK işi raw_gratis'i (kullanıcının kendi kararıyla budanmış halini)
# birebir kolon adlarıyla yansıtmak + SADECE gerçekten kirli/parse edilemeyen metin alanlarının
# (ztedarik/description gibi) DEĞERİNİ temizlemektir - isim değişikliği YOK, birim/tip dönüşümü
# YOK. Kanonik alana eşleme (field_mapping) tamamen AYRI ve SONRAKİ bir adım - her site kendi
# clean_{site}'ı hazır olduğunda (silver_products şu an PROTOTİP, nihai tablo değil) yazılacak/
# revize edilecek.
#
# Üç kova: delete / keep / use.
#   delete -> raw_gratis'ten TAMAMEN silindi (kullanıcı kararıyla). Kesin/mekanik silme listesi
#             gratis_at.json'dır (tek doğruluk kaynağı) - buradaki gruplar sadece NEDEN
#             silindiğinin kısa kaydı, path başına ayrı analiz metni YOK.
#   keep   -> clean_gratis'te duruyor, kendi adıyla, field_mapping'e girip girmeyeceği HENÜZ
#             kararlaştırılmadı.
#   use    -> clean_gratis'te duruyor, kendi adıyla - field_mapping'in kanonik bir alana
#             bağlayacağı güçlü aday (ama bağlama işlemi BURADA değil, field_mapping'te olur).
#
# analysis: gerçek SQL sorgusuyla doğrulanmış bulgu. reason: kararın kısa gerekçesi.
# target: SADECE İLERİDE field_mapping yazılırken/revize edilirken referans notu - clean_gratis
#         kurulumunda kullanılmıyor, kolon adını DEĞİŞTİRMEZ.
#
# columns.csv bu dosyanın HAM veri kaynağı - python -m matching.analysis.profile_columns gratis
# ile yeniden üretilir.

_shared:
  kozmetik_tanimlayici: &kozmetik_tanimlayici >-
    Gerçek bir kozmetik ürün özelliği (renk tonu/SPF/kalıcılık gibi) - fiyat takibi için gerekli
    değil ama gelecekte fuzzy matching'te aynı ürünün varyantlarını ayırt etmekte işe yarayabilir.
  analitik_uzun_vadeli: &analitik_uzun_vadeli >-
    Fiyat takibi kapsamımızın dışında ama kullanıcının uzun vadeli analitik hedefleri için
    saklanıyor (bkz. gratis_at_check.txt: "dinamik analitik tablosu" fikri).

columns:

  delete:

    # "Elektrikli Ürünler" kategorisine özel teknik spesifikasyon (kategori çapraz kontrolüyle doğrulandı)
    elektronik_disi:
      - attributes.baglantiTipi
      - attributes.baslikSayisi
      - attributes.bicakSayisi
      - attributes.burunVeKulakTemizleme
      - attributes.difuzor
      - attributes.dijitalEkran
      - attributes.dokunmatikKontrol
      - attributes.gucKaynagi
      - attributes.gucW
      - attributes.hizAyari
      - attributes.isiAyari
      - attributes.isletimSistemi
      - attributes.iyonOzelligi
      - attributes.maksimumSicaklik
      - attributes.masaCapi
      - attributes.mikrofon
      - attributes.otomatikKapanma
      - attributes.plakaMateryali
      - attributes.sarjOlmaSuresi
      - attributes.sogukHava
      - attributes.temizlikFircasi
      - attributes.yalitimSuresi

    # Kozmetik dışı başka bir kategoriye özel (Ev & Yaşam / Moda & Aksesuar / Süpermarket)
    kategori_disi_diger:
      - attributes.ayakNumarasi
      - attributes.beden
      - attributes.kalinlik
      - attributes.malzeme
      - attributes.materyal
      - attributes.nevresimTipi
      - attributes.sekil
      - attributes.sizeVariant
      - attributes.tur
      - attributes.urunCesidi
      - attributes.urunTuru
      - attributes.yikanabilir

    # Gerçek kozmetik özelliği (SPF/renk tonu/kalıcılık vb.) ama şimdilik kapsam dışı - ileride fuzzy matching'te işe yarayabilirdi, kullanıcı yine de atmayı tercih etti
    kozmetik_ozellik_kapsam_disi:
      - attributes.antiperspirant
      - attributes.aroma
      - attributes.ciltTipi
      - attributes.cinsiyet
      - attributes.colorShadeVariant
      - attributes.colorShadeVariantCode
      - attributes.emicilik
      - attributes.etki
      - attributes.features
      - attributes.finish
      - attributes.fircaKalinligi
      - attributes.fircaKiliSertligi
      - attributes.fircaTipi
      - attributes.form
      - attributes.gorunum
      - attributes.icerik
      - attributes.kalicilik
      - attributes.kapaticilik
      - attributes.kilTipi
      - attributes.kullanimAmaci
      - attributes.renkKodu
      - attributes.sacTipi
      - attributes.spf
      - attributes.suBazli
      - attributes.subBrand
      - attributes.suyaDayaniklilik
      - attributes.tutuculukSertlik
      - attributes.urunSerisi

    # Muğlak isimli / çok düşük doluluklu, derinlemesine analiz edilmedi
    belirsiz_dusuk_deger:
      - attributes.acmaOrani
      - attributes.adet
      - attributes.agirlik
      - attributes.alkolOrani
      - attributes.assortmentVariant
      - attributes.boy
      - attributes.boyut
      - attributes.boyutEbat
      - attributes.ebat
      - attributes.islev
      - attributes.kapasite
      - attributes.kullanim
      - attributes.kullanimAlani
      - attributes.miktar
      - attributes.ozellik
      - attributes.paketIcerigi
      - attributes.parcaSayisi
      - attributes.pudra
      - attributes.siseMateryali
      - attributes.tip
      - attributes.toplamAdet
      - attributes.urunTipi
      - attributes.videos
      - attributes.volumeVariant
      - attributes.yikamaSayisi

    # Başka bir kolonun metin/format kopyası ya da tüm veri setinde sabit tek değer
    format_kopyasi_veya_sabit:
      - attributes.orderLimit
      - attributes.ratingAvg
      - attributes.ratingAvgRound
      - badgeDescription
      - bannerTextOne
      - bannerTextTwo
      - bannerTexts
      - isActive
      - prices.discountRateLabel
      - prices.discountedPriceLabel
      - prices.discountedText
      - prices.normalPriceLabel
      - prices.promotionLabel
      - prices.promotionPriceLabel

    # İç sistem/kampanya verisi ya da (prices.currency) artık gerekmeyen sabit alan (bkz. field_mapping -> static)
    ic_veri_veya_gereksiz:
      - attributes.backShelfOrder
      - attributes.tags
      - attributes.taxCode
      - badges
      - prices.currency

    # Kullanıcının clean_gratis'te görmek istemediğini belirttiği, ek analiz yapılmayan kolonlar
    kullanici_karari:
      - images
      - variants.type
      - variants.values

  keep:
  - path: analytics.favoriteCount
    analysis: >-
      DÜZELTME (2026-08-03, kullanıcı kararı): önce 'at' idi. %100 dolu, 10236 farklı değer - kaç
      kullanıcı favoriledi. Aynı gerekçeyle (bkz. analytics.viewCount) saklanıyor.
    reason: *analitik_uzun_vadeli
  - path: analytics.salesCount
    analysis: >-
      DÜZELTME (2026-08-03, kullanıcı kararı): önce 'at' idi (rossmann _source.sold emsaliyle). %100
      dolu, 6276 farklı değer - satış adedi sayacı. Kullanıcı bu alanı rossmann'daki units_sold
      kararından AYRI tuttu, analytics.* ailesinin tamamını "belki dinamik analitik tablosu"
      gerekçesiyle saklamayı tercih etti.
    reason: *analitik_uzun_vadeli
  - path: analytics.viewCount
    analysis: >-
      DÜZELTME (2026-08-03, kullanıcı kararı): önce 'at' idi. %100 dolu, 16222 farklı değer - ürün
      sayfası görüntülenme sayısı. Kullanıcı gerekçesi (gratis_at_check.txt): "belki dinamik analitik
      tablosu kurup siteler ile ilişkilendirebiliriz, uzun vadeli hedeflerim için lazım olabilir" -
      rossmann _source.sold ile aynı kategoride olsa da (dahili popülerlik sinyali) o kararın aksine
      burada SAKLANMASI istendi.
    reason: *analitik_uzun_vadeli
  - path: attributes.brandId
    analysis: >-
      DÜZELTME (2026-08-03, kullanıcı kararı): önce 'at' idi. 489 distinct - attributes.brand ile TAM
      1:1 (aynı 489), markanın iç ID'si. Kullanıcı 'at' yerine 'sakla ama kullanma' dedi - brand adı
      zaten yeterli olsa da marka isim yazım farklarını (case/aksan) normalize etmeden STABIL bir
      marka anahtarı olarak ileride işe yarayabilir.
    reason: "brand'in şu an için kopyası ama stabil/sayısal marka kimliği olarak saklanmaya değer."
  - path: attributes.categoryIds
    analysis: >-
      %100 dolu, categories ile POZİSYONEL 1:1 (örn. [501,50101,5010104] <-> [Makyaj,Dudak
      Makyajı,Dudak Kalemi]) - sayısal/stabil hiyerarşi ID'si.
    reason: >-
      category_path (metin) zaten okunabilir kaynak olarak yeterli; ID'ler kanonik taksonomi eşlemesi
      gerekirse (configs/taxonomy/) daha stabil bir anahtar olabilir.
  - path: attributes.cesit
    analysis: >-
      DÜZELTME (2026-08-03, kullanıcı kararı): önce 'at' idi. %97.8 dolu AMA alan aşırı
      yüklenmiş/tutarsız: değerler arasında '150 ml' (hacim), 'Set'/'Tekli'/'Çoklu' (paket tipi),
      '21-30 gr' (ağırlık aralığı), 'Tüm Cilt Tipleri' (cilt tipi!) karışık geliyor - Gratis'in kendi
      veri girişinde kategoriye göre farklı anlamlara gelen tek bir alan. Kullanıcı gerekçesi: "miktar
      bilgisi içeriyor, sakla" - kirliliğin farkında olarak atmayıp saklama kararı.
    reason: >-
      Kaynakta anlamı kategoriye göre değişen, tutarsız/kirli bir alan - güvenilir tek bir kanonik
      anlama indirgenemiyor ama miktar bilgisi taşıdığı için silinmesin, ileride kategori bazlı
      ayrıştırma denenebilir.
  - path: attributes.colorName
    analysis: "%38.2 dolu, 42 renk adı (örn. 'Pembe')."
    reason: *kozmetik_tanimlayici
  - path: attributes.description
    target: description_temiz
    analysis: >-
      %100 dolu, HTML formatlı uzun ürün açıklaması (9307 benzersiz). shared/text.py ->
      html_to_plain_text() ile TAM VERİ SETİNDE doğrulandı (2026-08-03, 39254 satır): 0 satır boş/None
      dönmedi, ortalama temiz uzunluk 851 karakter. Ham veri sadece <br> değil, karışık etiket seti
      içeriyor (<b>, <i>, <strong>, <h2>, <p>, bazı bozuk/tanımsız etiketler - <vr>, <g>, dengesiz
      <h2></h2></h2> gibi) + HTML entity'ler (&bull;/&uuml;/ &ccedil;). Temizlik sonrası 43/39254
      satırda hâlâ '<'/'>' kalmıştı - 13'ü GERÇEK kaynak hatasıydı (Gratis'in kendi verisinde '<br<' -
      kapanmamış etiket, düzeltildi), 30'u MEŞRU ürün içeriği (ingredient yüzdeleri, örn. '<%5
      Noniyonik Yüzey Aktif Madde' = "%5'ten az" - kimyasal karşılaştırma işareti, BİLEREK
      dokunulmadı). Kalan 1 satırda tekil/nadir bir kaynak bozulması var ('<brAcid' bir ingredient
      adının içine karışmış) - düzeltmeye değmeyecek kadar nadir (39254'te 1), olduğu gibi bırakıldı.
    reason: >-
      Ham HTML metin olarak silver_products'a girmemeli - clean_gratis'te html_to_plain_text ile
      temizlenmiş, okunabilir düz metin (description_temiz) olarak durur, silver_products'a taşınmaz.
  - path: attributes.hacim
    analysis: >-
      %38.1 dolu. Örnekler isimden regex'le çıkardığımız size_value ile BİREBİR örtüşüyor (örn.
      hacim='15 ml' <-> isim '...15 ml') ama YAPISAL kaynak - parse_size'ın "150l" gibi parser
      hatalarına hiç maruz değil. 14168 satır 'ml', 793 'gr', birkaç düzensiz birim (cc, boş) var.
    reason: >-
      GERÇEK ÖNERİ: parse_size'ın name-regex yöntemi yerine (ya da önce) bu alan kullanılsa
      size_value/size_unit çok daha güvenilir olur. Bu, normalize.py'ye dokunan AYRI bir karar/görev -
      burada sadece işaretleniyor, şimdi uygulanmıyor.
  - path: attributes.keywords
    analysis: >-
      %100 dolu, gerçek/okunabilir arama terimleri (örn. 'Gel Lip Pencil', 'Matte Lip Pencil') -
      tags'ten (kampanya kodu) FARKLI, gerçek ürün tanımlayıcı ifadeler.
    reason: *kozmetik_tanimlayici
  - path: attributes.maxInstalments
    analysis: "%100 dolu ama 4 farklı değer (1,3,6,9) - ürüne göre değişen taksit sayısı, sabit değil."
    reason: "Kredi kartı taksit bilgisi, fiyat takibi kapsamımızın dışında ama gerçek/değişken veri."
  - path: attributes.zmensei
    analysis: "%97.9 dolu, 61 farklı ülke (örn. Hindistan, Hollanda, Japonya) - menşei ülke."
    reason: *kozmetik_tanimlayici
  - path: attributes.ztedarik
    target: tedarikci_bilgisi
    analysis: >-
      DÜZELTME (2026-08-03, kullanıcı kararı): önce 'at' idi. %98.3 dolu (38583/39254), HTML formatlı
      tedarikçi/ithalatçı yasal bilgi metni - kalıp DÜZENLİ: '<b>Etiket:</b> Değer<br>...'.
      shared/text.py -> parse_html_label_value_blob() ile {etiket: değer} sözlüğüne çevrildiği TAM
      VERİ SETİNDE doğrulandı (2026-08-03): 38583/38583 satır (%100) sorunsuz ayrıştı, SIFIR hata. 24
      farklı anahtar-kombinasyonu var ama hepsi aynı çekirdek şemanın varyasyonu (Satıcının
      İsmi/Kayıtlı Ticari Ünvan/Posta Adresi/E-Posta Adresi hep sabit, %83.8'i - 32331 satır -
      İmalatçı/İthalatçı Bilgileri ile tam 5 alanlı; kalanı tedarikçiden tedarikçiye değişen alan
      adlandırması - örn. 'İthalatçı Firma', 'Üretici İsmi' - sözlük yapısı bunu doğal karşılıyor,
      sabit şema gerekmiyor).
    reason: >-
      Ham HTML metin olarak silver_products'a girmemeli (kullanıcı kararı: kendi iç analizlerimizde
      kullanabiliriz, silver'a gerek yok) - clean_gratis'te parse_html_label_value_blob ile
      temizlenmiş MAP/STRUCT olarak durur, silver_products'a hiç taşınmaz.
  - path: reviewAverage
    analysis: >-
      %85.1 dolu (kalan %14.9 hiç yorum almamış ürünler, reviewCount ile birlikte NULL - tutarlı).
    reason: "Kullanıcı puanı, fiyat takibi kapsamımızın dışında."
  - path: reviewCount
    analysis: "reviewAverage ile aynı doluluk/tutarlılık."
    reason: "Kullanıcı puanı, fiyat takibi kapsamımızın dışında."
  - path: variantCount
    analysis: >-
      %45.1 dolu, metin (örn. '5 Renk') - variants.type/values ile aynı bilginin okunabilir özeti.
    reason: *kozmetik_tanimlayici

  use:
  - path: _category_folder
    analysis: >-
      MinIO obje yolundan türetilen crawl-zamanı meta veri, %100 dolu, 14 farklı değer
      (main_categories sayısı).
    reason: "Provenance - hangi kategoriden geldiği izlenebilir kalmalı."
  - path: _fetch_date
    analysis: "Crawl tarihi, %100 dolu."
    reason: "Fiyat geçmişinin can damarı - dedupe ve tarih partition'ı bu alana dayanıyor."
  - path: _row_id
    analysis: "Ham tablodaki satır kimliği, %100 dolu, benzersiz (39254/39254)."
    reason: "Silver dedupe'ında deterministik sıralama anahtarı."
  - path: _source_object
    analysis: "MinIO obje adı, %100 dolu."
    reason: "Provenance - hangi arşiv dosyasından geldiği izlenebilir kalmalı."
  - path: attributes.brand
    target: brand
    analysis: "%100 dolu, 489 farklı marka."
    reason: "Marka adı."
  - path: attributes.categories
    target: category_path
    analysis: >-
      %100 dolu, liste (örn. [Makyaj, Dudak Makyajı, Dudak Kalemi]) - array_to_string ile ' > '
      birleştiriliyor.
    reason: "Kategori hiyerarşisi."
  - path: attributes.displayName
    target: name
    analysis: >-
      %100 dolu, 13095 benzersiz (13111 üründen çok az daha az - birkaç ürün aynı ismi paylaşıyor,
      muhtemelen farklı renk/ton varyantı).
    reason: "Ürün adı."
  - path: attributes.eanUpc
    target: ean
    analysis: >-
      %100 dolu. 264 satır 11 haneli (baştaki sıfır kırpık) - shared/text.py normalize_gtin bunu sola
      sıfır doldurarak çözüyor.
    reason: "Barkod."
  - path: id
    target: source_product_id
    analysis: "%100 dolu, 13111 benzersiz - product_id_field zaten bu."
    reason: "Ürün kimliği."
  - path: imageUrls
    target: image_url
    analysis: >-
      %100 dolu, her satırda tam 1 eleman, fileUrl mutlak URL. 3 rastgele URL canlı HEAD ile
      doğrulandı (200, image/webp).
    reason: "Ürün görseli - 2026-08-02'de eklendi, önceden bu alan hiç eşlenmemişti."
  - path: prices.discountRate
    target: discount_rate
    analysis: >-
      %100 dolu, (1-sale/list)*100 ile 13111/13111 satırda ±1 puan içinde uyumlu (doğrulandı
      2026-08-02).
    reason: "Hazır indirim oranı, hesaplananla tutarlı."
  - path: prices.discountedPrice
    target: sale_price_try
    analysis: >-
      %100 dolu. schema.org offers.price ile 3/3 canlı örnekte birebir eşleşmişti - koşulsuz gerçek
      fiyat.
    reason: "Fiyat takibi için stabil/güvenilir alan bu."
  - path: prices.normalPrice
    target: list_price_try
    analysis: >-
      %100 dolu, kuruş cinsinden BIGINT. Checkout ile doğrulanmıştı (verified_checkout, bkz.
      field_mapping).
    reason: "Üstü çizili referans fiyat."
  - path: prices.promotionPrice
    target: conditional_promo_price_try
    analysis: >-
      %100 dolu. 'Gratis Kart ile' koşullu fiyat, checkout'ta 838 TL ürün gerçekten 209,50 TL'ye
      düşmüştü.
    reason: "Koşullu (Gratis Kart) fiyat."
  - path: shareLink
    target: url
    analysis: >-
      %100 dolu, tam/çalışan SEO URL'i - id'den yeniden kurmaya çalışmak yanlış link üretiyordu (bkz.
      eski not).
    reason: "Ürün sayfası URL'i."
  - path: stockStatus
    target: stock_status_raw
    analysis: "%100 dolu, 4 değer (HIGH/MEDIUM/LOW/NONE)."
    reason: "Stok durumu."
