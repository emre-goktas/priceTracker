# Gratis (raw_gratis, 141 kolon) - kolon bazlı denetim.
#
# NASIL OKUNUR: her satır bir raw kolonu (path) için üç kararından biri:
#   kullan               -> clean_gratis'e girer (target boşsa path'ten türetilen isimle kalır)
#   at                    -> clean_gratis'e HİÇ girmez, raw_gratis'te durmaya devam eder
#   sakla_ama_kullanma    -> şimdilik at ile aynı davranır (clean_gratis'e girmez) ama "gelecekte
#                            işe yarayabilir" notuyla - "at"tan farkı sadece niyet/güven seviyesi
#
# GÜVEN SEVİYESİ: her `analysis` alanı gerçek bir SQL sorgusuyla doğrulandı (2026-08-03,
# matching/pricebot.duckdb üzerinde). Kategori-özel teknik spec kümesindeki (Elektrikli
# Ürünler/Ev&Yaşam) ~90 alanın hepsi TEK TEK derinlemesine incelenmedi - temsili birkaç
# örnek üzerinden kategori çapraz kontrolü yapıldı (bkz. ilgili not). Bu ayrım BİLEREK
# açık bırakıldı - "hepsini inceledim" yanılgısına düşmemek için.
#
# columns.csv bu dosyanın HAM veri kaynağı (doluluk/distinct/örnek) - python -m
# matching.analysis.profile_columns gratis ile yeniden üretilir, elle düzenlenmez.

_shared:
  format_kopyasi: &format_kopyasi >-
    Yanındaki sayısal alanın TL-formatlı metin hali (örn. 54800 -> "548,00 TL") - aynı bilgi,
    biçimlendirilmiş kopyası. Gösterim katmanı işi, veri katmanında gereksiz.
  sabit_deger: &sabit_deger >-
    Bu veri setinde TEK bir değer alıyor (distinct_count=1) - doğrulandı, ayırt edici bilgi
    taşımıyor. Muhtemelen API'nin sabit döndürdüğü ya da sadece belirli bir durumda (örn.
    sadece aktif ürünler döndüğü için isActive hep true) değişen bir alan.
  elektronik_disi: &elektronik_disi >-
    "Elektrikli Ürünler" kategorisine özel teknik spesifikasyon - örnek satırlar kategori
    çapraz kontrolüyle doğrulandı (attributes.categories[1]='Elektrikli Ürünler'). Kozmetik
    odaklı kapsamımızla (bkz. CLAUDE.md) ilgisi yok.
  kategori_disi_diger: &kategori_disi_diger >-
    Kozmetik dışı bir kategoriye (Ev & Yaşam / Moda & Aksesuar / Süpermarket) özel alan -
    isim ve doluluk oranından (çok düşük, dar bir alt-kümede) çıkarımla değerlendirildi,
    her biri tek tek kategori kontrolünden geçirilmedi.
  kozmetik_tanimlayici: &kozmetik_tanimlayici >-
    Gerçek bir kozmetik ürün özelliği (renk tonu/SPF/kalıcılık gibi) - fiyat takibi için
    gerekli değil ama gelecekte fuzzy matching'te aynı ürünün varyantlarını (ton, SPF,
    boy) ayırt etmekte işe yarayabilir. Bilerek "sakla_ama_kullanma".
  belirsiz_dusuk_guven: &belirsiz_dusuk_guven >-
    Genel/muğlak isimli, düşük doluluklu bir alan - içeriği örneklerden makul görünüyor
    ama TEK TEK derin analiz yapılmadı, düşük güvenle "sakla_ama_kullanma" (yanlışlıkla
    atılmasın diye ihtiyatlı tarafta kalındı).

columns:
  # --- Sağlanan meta/izlenebilirlik alanları (JSON'dan değil, bizim eklediğimiz) ---
  - path: _category_folder
    verdict: kullan
    analysis: "MinIO obje yolundan türetilen crawl-zamanı meta veri, %100 dolu, 14 farklı değer (main_categories sayısı)."
    reason: "Provenance - hangi kategoriden geldiği izlenebilir kalmalı."
  - path: _fetch_date
    verdict: kullan
    analysis: "Crawl tarihi, %100 dolu."
    reason: "Fiyat geçmişinin can damarı - dedupe ve tarih partition'ı bu alana dayanıyor."
  - path: _row_id
    verdict: kullan
    analysis: "Ham tablodaki satır kimliği, %100 dolu, benzersiz (39254/39254)."
    reason: "Silver dedupe'ında deterministik sıralama anahtarı."
  - path: _source_object
    verdict: kullan
    analysis: "MinIO obje adı, %100 dolu."
    reason: "Provenance - hangi arşiv dosyasından geldiği izlenebilir kalmalı."

  # --- Zaten kanonik alana eşlenmiş (mevcut field_mapping) ---
  - path: id
    verdict: kullan
    target: source_product_id
    analysis: "%100 dolu, 13111 benzersiz - product_id_field zaten bu."
    reason: "Ürün kimliği."
  - path: attributes.eanUpc
    verdict: kullan
    target: ean
    analysis: "%100 dolu. 264 satır 11 haneli (baştaki sıfır kırpık) - shared/text.py normalize_gtin bunu sola sıfır doldurarak çözüyor."
    reason: "Barkod."
  - path: attributes.displayName
    verdict: kullan
    target: name
    analysis: "%100 dolu, 13095 benzersiz (13111 üründen çok az daha az - birkaç ürün aynı ismi paylaşıyor, muhtemelen farklı renk/ton varyantı)."
    reason: "Ürün adı."
  - path: attributes.brand
    verdict: kullan
    target: brand
    analysis: "%100 dolu, 489 farklı marka."
    reason: "Marka adı."
  - path: shareLink
    verdict: kullan
    target: url
    analysis: "%100 dolu, tam/çalışan SEO URL'i - id'den yeniden kurmaya çalışmak yanlış link üretiyordu (bkz. eski not)."
    reason: "Ürün sayfası URL'i."
  - path: imageUrls
    verdict: kullan
    target: image_url
    analysis: "%100 dolu, her satırda tam 1 eleman, fileUrl mutlak URL. 3 rastgele URL canlı HEAD ile doğrulandı (200, image/webp)."
    reason: "Ürün görseli - 2026-08-02'de eklendi, önceden bu alan hiç eşlenmemişti."
  - path: prices.currency
    verdict: kullan
    target: currency
    analysis: "%100 dolu, tek değer (TRY)."
    reason: "Para birimi."
  - path: prices.normalPrice
    verdict: kullan
    target: list_price_try
    analysis: "%100 dolu, kuruş cinsinden BIGINT. Checkout ile doğrulanmıştı (verified_checkout, bkz. field_mapping)."
    reason: "Üstü çizili referans fiyat."
  - path: prices.discountedPrice
    verdict: kullan
    target: sale_price_try
    analysis: "%100 dolu. schema.org offers.price ile 3/3 canlı örnekte birebir eşleşmişti - koşulsuz gerçek fiyat."
    reason: "Fiyat takibi için stabil/güvenilir alan bu."
  - path: prices.promotionPrice
    verdict: kullan
    target: conditional_promo_price_try
    analysis: "%100 dolu. 'Gratis Kart ile' koşullu fiyat, checkout'ta 838 TL ürün gerçekten 209,50 TL'ye düşmüştü."
    reason: "Koşullu (Gratis Kart) fiyat."
  - path: prices.discountRate
    verdict: kullan
    target: discount_rate
    analysis: "%100 dolu, (1-sale/list)*100 ile 13111/13111 satırda ±1 puan içinde uyumlu (doğrulandı 2026-08-02)."
    reason: "Hazır indirim oranı, hesaplananla tutarlı."
  - path: stockStatus
    verdict: kullan
    target: stock_status_raw
    analysis: "%100 dolu, 4 değer (HIGH/MEDIUM/LOW/NONE)."
    reason: "Stok durumu."
  - path: attributes.categories
    verdict: kullan
    target: category_path
    analysis: "%100 dolu, liste (örn. [Makyaj, Dudak Makyajı, Dudak Kalemi]) - array_to_string ile ' > ' birleştiriliyor."
    reason: "Kategori hiyerarşisi."

  # --- YENİ BULGU: yapısal boyut/miktar alanları - regex'ten (parse_size) DAHA GÜVENİLİR ---
  - path: attributes.hacim
    verdict: sakla_ama_kullanma
    analysis: >-
      %38.1 dolu. Örnekler isimden regex'le çıkardığımız size_value ile BİREBİR örtüşüyor
      (örn. hacim='15 ml' <-> isim '...15 ml') ama YAPISAL kaynak - parse_size'ın "150l"
      gibi parser hatalarına hiç maruz değil. 14168 satır 'ml', 793 'gr', birkaç düzensiz
      birim (cc, boş) var.
    reason: "GERÇEK ÖNERİ: parse_size'ın name-regex yöntemi yerine (ya da önce) bu alan
      kullanılsa size_value/size_unit çok daha güvenilir olur. Bu, normalize.py'ye dokunan
      AYRI bir karar/görev - burada sadece işaretleniyor, şimdi uygulanmıyor."
  - path: attributes.agirlik
    verdict: sakla_ama_kullanma
    analysis: "%0.6 dolu ama değerleri hacim'e benzer yapıda (örn. '100 gr') - ağırlık cinsinden aynı boyut kümesi."
    reason: *belirsiz_dusuk_guven
  - path: attributes.kapasite
    verdict: sakla_ama_kullanma
    analysis: "%0.2 dolu, 'ml' cinsinden (örn. '600 ml') - muhtemelen kap/şişe kapasitesi, hacim ile örtüşebilir."
    reason: *belirsiz_dusuk_guven
  - path: attributes.miktar
    verdict: sakla_ama_kullanma
    analysis: "%0.9 dolu, 'Adet' cinsinden (örn. '1 Adet', '2 Adet') - paket içi parça sayısı, hacim/ağırlıktan FARKLI bir eksen (adet)."
    reason: *belirsiz_dusuk_guven
  - path: attributes.volumeVariant
    verdict: sakla_ama_kullanma
    analysis: "%0.5 dolu, hacim ile aynı formatta (örn. '15 ml') ama VARYANT seçici alanı olabilir (bir ürünün 15/50/100ml seçenekleri)."
    reason: *belirsiz_dusuk_guven
  - path: attributes.sizeVariant
    verdict: sakla_ama_kullanma
    analysis: "%0.3 dolu, değerler '3','2','S' gibi - hacim değil, giysi/ayakkabı BEDEN varyantı."
    reason: *kategori_disi_diger
  - path: attributes.boyutEbat
    verdict: sakla_ama_kullanma
    analysis: "%0.2 dolu, 'EN x BOY cm' formatı (örn. '15 x 15 cm') - hacim/ağırlıktan TAMAMEN FARKLI bir eksen (fiziksel ölçü, örn. mendil paketi boyutu)."
    reason: *belirsiz_dusuk_guven
  - path: attributes.ebat
    verdict: sakla_ama_kullanma
    analysis: "%0.1 dolu, boyutEbat ile aynı yapıda (EN x BOY cm)."
    reason: *belirsiz_dusuk_guven
  - path: attributes.boyut
    verdict: sakla_ama_kullanma
    analysis: "%0.0 dolu (13/39254), değerler 'Orijinal' gibi metin - boyut/ebat kümesinden farklı, muğlak."
    reason: *belirsiz_dusuk_guven
  - path: attributes.toplamAdet
