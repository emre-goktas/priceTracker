    analysis: "%100 dolu, categories ile POZİSYONEL 1:1 (örn. [501,50101,5010104] <-> [Makyaj,Dudak Makyajı,Dudak Kalemi]) - sayısal/stabil hiyerarşi ID'si."
    reason: "category_path (metin) zaten okunabilir kaynak olarak yeterli; ID'ler kanonik taksonomi eşlemesi gerekirse (configs/taxonomy/) daha stabil bir anahtar olabilir."
  - path: attributes.keywords
