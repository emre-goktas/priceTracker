# Eveshop (raw_eveshop) kolon denetimi — 2. SÜRÜM (2026-08-07, products.json şeması).
#
# ÖNEMLİ: Bu dosya HTML-kazıma döneminin (2026-08-05) 91-kolonluk denetimini TAMAMEN
# değiştiriyor - eski sürüm git geçmişinde duruyor, referans gerekirse oradan bakılabilir.
# 2026-08-06'da category_search_api HTML kategori kazımadan (444+ istek, 2 kez WAF blokuna
# takıldı) Shopify'ın herkese açık toplu ürün feed'ine (products.json, ~30 istek, sıfır blok,
# ~7414 ürün) çevrildi. Eski 91 kolonun büyük kısmı (variant.compare_at_price,
# variant.featured_image, variant.requires_shipping, variant.taxable, variant.weight,
# variant.quantity_rule.*, vb.) artık AYRI bir raw_eveshop kolonu olarak hiç yok - flatten()'in
# hiç açmadığı variants/images STRUCT[] kolonlarının İÇİNDE gömülü kaldılar. Eski
# delete/keep/use mekanizması (DESCRIBE raw_eveshop çıktısı üzerinde çalışan) bunlara artık
# hiç dokunmuyor - üstüne ekstra depolama/işlem maliyeti de yok (satırlar patlatılmıyor).
#
# Üç kova (diğer 3 siteyle aynı sözleşme): delete / keep / use.
#   delete -> raw_eveshop'tan TAMAMEN silinecek.
#   keep   -> clean_eveshop'ta duruyor, field_mapping'e girip girmeyeceği HENÜZ kararlaştırılmadı.
#   use    -> configs/tr/eveshop.yaml field_mapping'inde zaten kullanılıyor (2026-08-07'de
#             products.json şekline göre yeniden yazıldı).
#
# columns.csv bu dosyanın HAM veri kaynağı - python -m matching.analysis.profile_columns eveshop
# ile yeniden üretilir.
#
# EK (2026-08-07, HTML-supplement): clean_eveshop'ta bu dosyanın delete/keep/use mekanizmasının
# HİÇ bilmediği 4 kolon daha var: ean_html, eve_price_html, qty_html, html_fetch_date. Bunlar
# raw_eveshop'tan (products.json) GELMİYOR - matching/eveshop_html_supplement.py'nin ayrı bir
# arşivden (main_categories_html_barkod_icin_gelecek, ara sıra çalışan HTML taraması) ürettiği
# eveshop_html_supplement tablosundan, matching/analysis/build_clean.py -> SUPPLEMENT_JOINS ile
# clean_eveshop'a LEFT JOIN edilir (product_id = id üzerinden). Barkod/eve_price/qty
# products.json'da yapısal olarak yok, sadece bu supplement'ta var - field_mapping'in
# ean/conditional_promo_price_try/discount_rate/stock_qty alanları bunları okur (bkz.
# configs/tr/eveshop.yaml). Kapsam %98.4 (7292/7414, 2026-08-07 taraması) - kalanı NULL.

columns:

  delete:

    # variants[1].option1/option2 ile TAM yapısal kopya - canlı doğrulandı (2026-08-07,
    # N=7414): options[1].values[1] = variants[1].option1 VE options[2].values[1] =
    # variants[1].option2, 7414/7414 satırda istisnasız.
    format_kopyasi:
      - options

  keep:
  - path: created_at
    analysis: "%100 dolu, gerçek TIMESTAMP (2683 farklı değer). Eski HTML kaynağındaki 'diff_day_create' (crawl anına göre RELATİF gün sayısı) alanının products.json'da karşılığı yok - o alan HTML temasının kendi hesabıydı, taşınmadı. Bunun yerine artık MUTLAK bir zaman damgası var, daha iyi bir sinyal."
    reason: "Gratis/Rossmann'ın created_at kararıyla tutarlı - 'yeni ürün' analizinde işe yarayabilir."
  - path: updated_at
    analysis: "%100 dolu ama sadece 30 farklı değer (arşivdeki 30 sayfanın her biri aynı çekim anında güncellenmiş gibi görünüyor - crawl anına yakın bir sunucu davranışı olabilir, derinlemesine incelenmedi). Eski HTML kaynağında hiç karşılığı yoktu, YENİ bir sinyal."
    reason: "Son değişiklik zaman damgası - gerçek anlamı netleşmeden field_mapping'e alınmadı."
  - path: published_at
    analysis: "%100 dolu, gerçek TIMESTAMP (4970 farklı değer) - ürünün yayına alındığı MUTLAK zaman damgası. Eski HTML kaynağındaki 'diff_day_publish' (RELATİF gün sayısı) alanının yerini büyük ölçüde dolduruyor ama o alan taşınmadı (HTML temasının kendi hesabıydı)."
    reason: "Gratis/Rossmann'ın created_at kararıyla tutarlı - gerçek/değişken tarih verisi."
  - path: body_html
    analysis: "%100 dolu, HTML formatlı uzun ürün açıklaması (3960 benzersiz). Eski HTML kaynağında hiç karşılığı yoktu, YENİ - products.json'ın standart alanı."
    reason: "Gratis'in attributes.description kararıyla aynı kategori (bkz. matching/analysis/gratis/decisions.yaml) - hiçbir sitede şu an CANONICAL_FIELDS'ta bir description alanı yok, temizlenip kullanılması AYRI/gelecek bir karar."
  - path: tags
    analysis: "%100 dolu, VARCHAR[] liste (5035 farklı kombinasyon). İçerik karışık: bazı sayısal iç kodlar, birim/beden kısaltmaları (ML, BE), kampanya bayrakları (mindsite_excluded gibi) - derinlemesine incelenmedi."
    reason: "Keşfedilmemiş ama liste tipinde olduğu için satır patlatmadan düşük maliyetli saklanabilir - ileride işe yarayabilir."

  use:
  - path: _category_folder
    analysis: "MinIO obje yolundan türetilen crawl-zamanı meta veri, %100 dolu. Artık TEK değer ('urunler_tum_urunler') - products.json kategori kavramı bilmiyor, tek toplu feed."
    reason: "Provenance - hangi arşiv objesinden geldiği izlenebilir kalmalı."
  - path: _fetch_date
    analysis: "Crawl tarihi, %100 dolu (şu an tek tarih: 2026-08-06)."
    reason: "Fiyat geçmişinin can damarı - dedupe ve tarih partition'ı bu alana dayanıyor."
  - path: _row_id
    analysis: "Ham tablodaki satır kimliği, %100 dolu, benzersiz (7414/7414)."
    reason: "Silver dedupe'ında deterministik sıralama anahtarı."
  - path: _source_object
    analysis: "MinIO obje adı, %100 dolu (30 farklı - 31 arşiv objesinden biri boş sayfaydı, hiç satır katkısı olmadı)."
    reason: "Provenance - hangi arşiv dosyasından geldiği izlenebilir kalmalı."
  - path: id
    target: id
    analysis: "%100 dolu, 7414/7414 benzersiz - product_id_field zaten bu (2026-08-07: eski 'product_id'nin yerini aldı)."
    reason: "Ürün kimliği."
  - path: handle
    target: url
    analysis: "%100 dolu, 7414/7414 benzersiz - Shopify standart slug, base_url + '/products/' ile birleştiriliyor, canlı doğrulandı (200)."
    reason: "Ürün sayfası URL'i - eski product_url_regex'in yerini aldı, regex'e gerek kalmadı."
  - path: title
    target: name
    analysis: "%100 dolu, 7342 benzersiz. Eski HTML kaynağındaki 509 satırlık HTML entity kirliliği bu kaynakta YOK (tam katalogda sıfır entity bulundu, 2026-08-07)."
    reason: "Ürün adı."
  - path: vendor
    target: brand
    analysis: "%100 dolu, 287 farklı marka. Eski analytics_regex'in 'brand' alanının yerini aldı, regex'e gerek kalmadı."
    reason: "Marka adı."
  - path: product_type
    target: category_path
    analysis: "%100 dolu, 65 farklı değer, TAMAMI 'Eve Genel Hiyerarşi' kökü ile başlıyor (7414/7414, canlı doğrulandı 2026-08-07) - eski category_hierarchy (analytics_regex) ile AYNI kırpma formülü çalışıyor."
    reason: "Kategori hiyerarşisi - eski analytics_regex'in yerini aldı, regex'e gerek kalmadı."
  - path: variants
    target: source_sku + list_price_try + sale_price_try + is_in_stock
    analysis: >-
      STRUCT[] kolonu, flatten() tarafından açılmıyor - [1] ile erişiliyor (Watsons'ın
      images[1].url deseniyle aynı). 0/7414 çok-varyantlı (tam katalogda doğrulandı), yani [1]
      erişimi güvenli. price alt-alanı VARCHAR ondalık-TL string (örn. '418.00') - eski BIGINT
      kuruş formatından FARKLI, unit:kurus artık YOK sadece CAST. compare_at_price alt-alanı
      %100 NULL (DuckDB bu yüzden JSON tipine düşürmüş) - kullanılmadı, formül kurulmadı.
      barcode alt-alanı YAPISAL OLARAK YOK (7414/7414 variant objesi tarandı, hiç görülmedi) -
      ean alanı bu yüzden field_mapping'te strategy:none.
    reason: "sku/fiyat/stok-durumu bilgisinin tek kaynağı."
  - path: images
    target: image_url
    analysis: "STRUCT[] kolonu, hiçbir zaman boş değil (0/7414) ama bazen >1 eleman (4533/7414 çok-görselli). images[1].src (position=1, birincil görsel) ZATEN mutlak URL (cdn.shopify.com) - eski analytics_regex'in protokolsüz path'inin aksine önek eklemeye gerek yok."
    reason: "Ürün görseli - eski analytics_regex'in yerini aldı, regex'e gerek kalmadı."
